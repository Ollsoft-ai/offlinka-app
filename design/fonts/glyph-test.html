<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Archivo glyph test</title>
<style>
@font-face{font-family:T400;src:url(archivo_regular.ttf) format("truetype")}
@font-face{font-family:T600;src:url(archivo_semibold.ttf) format("truetype")}
@font-face{font-family:T700;src:url(archivo_bold.ttf) format("truetype")}
@font-face{font-family:X800;src:url(archivo_expanded_extrabold.ttf) format("truetype")}
/* fallback is a serif on purpose: any glyph missing from the TTF shows up as a visibly different letter */
body{margin:0;padding:24px;background:#F5F0E3;color:#17231C;width:900px;font-family:serif}
h1{font:16px/1.2 T700,serif;margin:0 0 14px;color:#5F5B4B}
section{background:#FFFDF7;border:1.5px solid #17231C;border-radius:8px;padding:14px 18px;margin-bottom:14px}
b{display:block;font:13px/1 T600,serif;color:#5F5B4B;margin-bottom:6px}
p{margin:0 0 4px;font-size:24px;line-height:1.3;overflow-wrap:anywhere}
</style></head><body>
<h1>Archivo TTFs for the apps: every Czech and Slovak letter (fallback = serif, so a missing glyph would stand out)</h1>
<script>
const S=['aábcčdďeéěfghiíjklĺľmnňoóôpqrŕřsštťuúůvwxyýzžä','AÁBCČDĎEÉĚFGHIÍJKLĹĽMNŇOÓÔPQRŔŘSŠTŤUÚŮVWXYÝZŽÄ',
'Příliš žluťoučký kůň úpěl ďábelské ódy. „Uložené“ … 0123456789 – § € °',
'Kŕdeľ šťastných ďatľov učí pri ústí Váhu mĺkveho koňa obhrýzať kôru.'];
for (const [f,n] of [['T400','Archivo-Regular 400'],['T600','Archivo-SemiBold 600'],['T700','Archivo-Bold 700'],['X800','ArchivoExpanded-ExtraBold 800']])
  document.write(`<section><b>${n}</b>${S.map(s=>`<p style="font-family:${f},serif">${s}</p>`).join('')}</section>`);
</script></body></html>
