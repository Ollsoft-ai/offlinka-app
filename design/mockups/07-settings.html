<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=393">
<title>Offlinka mockup: Settings</title>
<link rel="stylesheet" href="../out/web/tokens.css"><link rel="stylesheet" href="assets/mock.css">
<script src="assets/icons.js"></script><script src="assets/strings.js"></script><script src="assets/mock.js" defer></script>
<style>
  .blk { padding: 14px 14px 16px; }
  .blk + .blk, .blk + .row, .row + .blk { border-top: 1px solid var(--c-line-soft); }
  .blk .lb { font: 600 16px/21px var(--font-text); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .blk .lb em { font-style: normal; color: var(--c-ink2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .prev { margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: var(--c-bg); font: 400 19.5px/31px var(--font-text); color: var(--c-ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-ok); display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .pn { padding: 10px 18px 0; font: 400 13.5px/19px var(--font-text); color: var(--c-ink3); display: flex; gap: 8px; }
  .pn .ic { color: var(--c-ink3); }
  .row .val { font: 400 15px/20px var(--font-text); color: var(--c-ink2); }
  .row.danger b { color: var(--c-danger); }
</style>
</head>
<body>
<!-- Settings: language, light/dark, text size (with a live preview line in reader type), drive, history, about. -->
<div class="phone">
  <div class="status"><span>9:41</span><span class="si"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>
  <div class="scroll">
    <div class="ltitle" style="padding-top:14px"><h1 data-s="settings_title"></h1></div>

    <div class="gh"><span data-s="settings_section_display"></span></div>
    <div class="group">
      <a class="row"><i class="ic" data-i="globe"></i><span class="tx"><b data-s="settings_language"></b><span data-s="settings_language_system"></span></span><i class="ic ch" data-i="chevron_right"></i></a>
      <div class="blk"><div class="lb"><span data-s="settings_theme"></span></div>
        <div class="seg"><b class="on" data-s="settings_theme_system"></b><b data-s="settings_theme_light"></b><b data-s="settings_theme_dark"></b></div></div>
      <div class="blk"><div class="lb"><span data-s="settings_text_size"></span><em data-s="settings_text_size_value" data-p='{"n":"115"}'></em></div>
        <div class="slider"><div class="tr"></div><div class="fi" style="width:50%"></div>
          <i class="tk" style="left:0"></i><i class="tk" style="left:25%"></i><i class="tk" style="left:50%"></i><i class="tk" style="left:75%"></i><i class="tk" style="left:100%"></i>
          <div class="kn" style="left:50%"></div></div>
        <p class="prev" data-s="settings_text_size_preview"></p></div>
    </div>

    <div class="gh"><span data-s="settings_section_drive"></span></div>
    <div class="group">
      <div class="row"><i class="ic" data-i="drive"></i><span class="tx"><b><span class="dot"></span><span data-s="settings_drive_connected" data-p='{"name":"OFFLINKA"}'></span></b><span data-s="library_drive_edition" data-p='{"edition":"listopad 2026"}'></span></span></div>
      <a class="row"><i class="ic" data-i="folder"></i><span class="tx"><b data-s="settings_drive_change"></b></span><i class="ic ch" data-i="chevron_right"></i></a>
      <div class="row dim"><i class="ic" data-i="phone_copy"></i><span class="tx"><b data-s="settings_keep_copy_title"></b><span data-s="settings_keep_copy_body"></span></span><span class="tag soon" data-s="settings_soon"></span></div>
    </div>

    <div class="gh"><span data-s="settings_section_privacy"></span></div>
    <div class="group">
      <div class="row"><i class="ic" data-i="history"></i><span class="tx"><b data-s="settings_save_history"></b></span><span class="sw"></span></div>
      <a class="row"><i class="ic" data-i="clock"></i><span class="tx"><b data-s="settings_clear_searches"></b></span></a>
      <a class="row danger"><i class="ic" data-i="trash" style="color:var(--c-danger)"></i><span class="tx"><b data-s="history_clear"></b></span></a>
    </div>
    <p class="pn"><i class="ic s18" data-i="lock"></i><span data-s="settings_privacy_note"></span></p>

    <div class="group" style="margin-top:20px">
      <a class="row"><i class="ic" data-i="info"></i><span class="tx"><b data-s="settings_about"></b></span><i class="ic ch" data-i="chevron_right"></i></a>
    </div>
    <div style="height:112px"></div>
  </div>
  <nav class="nav">
    <a><i class="ic" data-i="home"></i><span data-s="nav_home"></span></a>
    <a><i class="ic" data-i="library"></i><span data-s="nav_library"></span></a>
    <a><i class="ic" data-i="bookmark"></i><span data-s="nav_saved"></span></a>
    <a class="on"><i class="ic" data-i="settings"></i><span data-s="nav_settings"></span></a>
  </nav>
  <div class="homeind"></div>
</div>
</body>
</html>
