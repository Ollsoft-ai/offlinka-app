:root{--ink:#22282B;--ink2:#566067;--line:#DFE5E1;--mist:#F2F6F3;--white:#fff;--green:#1FD15F;--green-d:#0B7A3B;--green-t:#E3F9EA;--warn:#FFF3C9;--warn-b:#F0C66B;--red:#B4321F;--r:20px;--f:Nunito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:500 17px/1.5 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:900;line-height:1.12;letter-spacing:-.01em}
a{color:var(--green-d)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--green-d);outline-offset:2px}

/* top bar (START page only; inner pages open in the Kiwix viewer) */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo svg{height:30px;width:auto;display:block}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--green-t);color:var(--green-d);font-weight:800;font-size:14px;padding:7px 13px;border-radius:99px;white-space:nowrap}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(31,209,95,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,209,95,0)}100%{box-shadow:0 0 0 0 rgba(31,209,95,0)}}
.sp{flex:1}
.lang{display:flex;background:var(--mist);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font-weight:800;font-size:14px;color:var(--ink2);padding:6px 12px;border-radius:99px}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}

/* search */
.search{position:relative;display:flex;background:#fff;border:2px solid var(--ink);border-radius:99px;box-shadow:0 5px 0 rgba(34,40,43,.12)}
.search>.ico{position:absolute;left:20px;top:50%;margin-top:-12px;color:var(--ink2);pointer-events:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:17px 12px 17px 56px;font-size:20px;font-weight:600;outline:0;border-radius:99px;text-overflow:ellipsis}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:#7A848A;font-weight:500}
.search button{border:0;background:var(--green);font-weight:900;font-size:18px;padding:0 28px;margin:5px;border-radius:99px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(34,40,43,.16);overflow:hidden;z-index:40;text-align:left}
.sug a{display:flex;align-items:center;gap:12px;padding:11px 18px;text-decoration:none;color:var(--ink);font-weight:700;font-size:17px}
.sug a.on,.sug a:hover{background:var(--mist)}
.sug a .ico{color:var(--green-d)}
.sug a em{font-style:normal;margin-left:auto;font-size:13px;font-weight:800;color:var(--ink2);background:var(--mist);padding:3px 10px;border-radius:99px;white-space:nowrap}
.sug a.on em,.sug a:hover em{background:#fff}

/* home */
.hero{background:var(--mist);padding:44px 0 34px;text-align:center}
.hero h1{font-size:clamp(34px,4.6vw,54px)}
.hero .sub{color:var(--ink2);font-size:19px;margin-top:10px}
.hero .search{max-width:760px;margin:26px auto 0}
.try{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--ink2)}
.try button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-weight:700;font-size:15px}
.try button:hover{border-color:var(--ink)}
/* "Počítač / Mobil" choice: the yellow phone button states the Kiwix prerequisite before anyone clicks */
.where{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;max-width:860px;margin:22px auto 0;text-align:left}
.where button{display:flex;align-items:center;gap:13px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px 16px;text-align:left;line-height:1.35;color:var(--ink)}
.where button>.ico{width:30px;height:30px}
.where b{font-weight:900;display:block;font-size:18.5px}
.where small{display:block;font-size:16px;color:var(--ink2)}
.where button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 4px 0 rgba(34,40,43,.12)}
.where .pc>.ico{color:var(--green-d)}
.where .pc .ok{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);display:grid;place-items:center;visibility:hidden}
.where .pc .ok .ico{width:17px;height:17px;stroke-width:3}
.where .pc[aria-pressed=true] .ok{visibility:visible}
.where .mobtip{background:var(--warn);border-color:var(--warn-b)}
.where .mobtip small{color:var(--ink);font-size:16.5px}
.where .mobtip>.ico{color:#8A5A00}
.where .mobtip[aria-pressed=true]{border-color:#8A5A00}
.where u{margin-left:auto;flex:none;text-decoration:none;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:5px 13px;font-size:15.5px;white-space:nowrap}
.where .mobtip:hover u{background:var(--ink);color:#fff}
.mcard{max-width:1000px;margin:14px auto 0;background:#fff;border:2px solid var(--warn-b);border-radius:var(--r);padding:22px 24px 20px;text-align:left;scroll-margin-top:80px}
.mcard[hidden]{display:none}
.mcard h2{font-size:25px;display:flex;align-items:center;gap:10px}
.mcard h3{font-size:18px;margin:18px 0 0}
.mcard .steps{grid-template-columns:repeat(3,1fr);margin-top:14px}
.mcard .steps li{grid-template-columns:1fr;gap:8px;background:var(--mist);padding:16px}
.mcard .mmore{display:inline-block;margin-top:14px;font-weight:800;font-size:16.5px}
.mcard .steps li{align-content:start}
.mcard .notes{grid-template-columns:repeat(3,1fr);margin-top:10px}
.mcard .notes li{background:#FFF8E1;align-items:start;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:-1px;padding:34px 0 8px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;min-height:186px;transition:transform .12s,border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 8px 0 rgba(34,40,43,.1)}
.tile .ib{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin-bottom:8px;background:var(--c1);color:var(--c2)}
.tile .ib .ico{width:32px;height:32px;stroke-width:1.9}
.tile h2{font-size:25px}
.tile p{color:var(--ink2);font-size:16px;line-height:1.4}
.tile .go{position:absolute;right:20px;top:24px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--ink)}
.tile:hover .go{background:var(--green)}
.tile .go .ico{width:19px;height:19px;stroke-width:2.6}
.tile .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.tile .chips span{font-size:13px;font-weight:800;background:var(--mist);border-radius:99px;padding:3px 10px;color:var(--ink)}
.kxline{display:flex;align-items:center;gap:18px;border:2px solid var(--line);border-radius:var(--r);padding:14px 20px;margin:10px 0 0;font-size:17px;line-height:1.45}
.kxline b{font-weight:900}
.kxmini{flex:none;display:flex;gap:4px;background:#f4f6f8;border:1px solid #aaa;border-radius:6px;padding:5px}
.kbtn{display:inline-block;font:400 16px/20px Arial,"Liberation Sans",Helvetica,sans-serif;color:#000;background:#ededed;border:1px solid #b5b2b2;border-radius:3px;padding:4px 6px;font-style:normal;white-space:nowrap;vertical-align:middle}
.card{border-radius:var(--r);padding:26px;background:var(--mist);margin:18px 0 14px}
.card h2{font-size:25px;display:flex;align-items:center;gap:10px}
.card .sizes{columns:2;column-gap:40px}
.card .sizes li{break-inside:avoid}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;align-items:start}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--green);font-weight:900;font-size:21px;display:grid;place-items:center}
.steps b{font-weight:900;font-size:18px;display:block}
.steps span{color:var(--ink2);font-size:16px;line-height:1.4;display:block;margin-top:2px}
.notes{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.notes li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px 16px;font-size:17px;line-height:1.4;color:var(--ink)}
.notes li .ni{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--warn);color:#8A5A00}
.notes b{font-weight:900}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#fff;margin-top:16px;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.sizes{list-style:none;margin:14px 0 0;padding:0;font-size:15.5px}
.sizes li{display:flex;align-items:baseline;gap:9px;padding:5.5px 0;border-bottom:1px solid var(--line)}
.sizes li i{width:10px;height:10px;border-radius:3px;flex:none;align-self:center}
.sizes li b{margin-left:auto;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.sizes li.free{border:0;font-weight:800;color:var(--green-d)}
.sizes li.free i{background:#fff;border:1.5px solid var(--green-d)}
/* "Vyzkoušejte hned" strip */
.tryx{padding:30px 0 4px}
.tryx>h2{font-size:27px;margin-bottom:14px}
.tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tc{border:2px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0}
.tc h3{font-size:19px;display:flex;align-items:center;gap:8px}
.tc h3 .ico{color:var(--c2)}
.tc p{font-size:15.5px;color:var(--ink2);line-height:1.4}
.tc p b{color:var(--ink);font-weight:900}
.tc .warnl{font-size:13.5px;font-weight:800;color:#8A5A00;background:var(--warn);border-radius:8px;padding:4px 8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button,.pick a{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-weight:800;font-size:14.5px;text-decoration:none;color:var(--ink);line-height:1.4}
.pick a::after{content:" →";color:var(--ink2)}
.pick button:hover,.pick a:hover{border-color:var(--ink)}
.pick button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.peaks{display:block;width:100%;height:auto}
.peaks text{font:900 15px var(--f);fill:var(--ink)}
.peaks path[data-peak]{cursor:pointer}
.tc .more{margin-top:auto;font-weight:800;font-size:15.5px;text-decoration:none}
.tc .more:hover{text-decoration:underline}
.mprev{position:relative;height:124px;border-radius:12px;border:1px solid var(--line);background:#e5ecd9;overflow:hidden}
.ml{position:absolute;width:2160px;height:1440px;background:var(--mapimg) 0 0/100% 100% no-repeat;transition:left .7s cubic-bezier(.2,.7,.2,1),top .7s cubic-bezier(.2,.7,.2,1)}
.mprev .cap{position:absolute;right:6px;bottom:5px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.88);border-radius:6px;padding:1px 6px;color:var(--ink2)}

/* shelves: the curated Czech page each tile opens */
.shelf{padding:22px 0 30px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;text-decoration:none;color:var(--ink2);font-size:15.5px}
.back:hover{color:var(--ink)}
.shelf h1{font-size:clamp(32px,4vw,46px);display:flex;align-items:center;gap:14px;margin-top:12px}
.shelf h1 .ib{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--c1);color:var(--c2);flex:none}
.shelf h1 .ib .ico{width:30px;height:30px}
.shelf .lead{color:var(--ink2);font-size:18px;margin-top:8px;max-width:820px}
.shelf .search{max-width:760px;margin-top:20px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:22px 0 0;padding:0;list-style:none}
.si{display:flex;gap:13px;align-items:flex-start;height:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);background:#fff}
a.si:hover{border-color:var(--ink)}
.si .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c1);color:var(--c2);font-weight:900;display:grid;place-items:center;font-size:16px}
.si b{display:block;font-size:18.5px;font-weight:900;line-height:1.2}
.si small{display:block;font-size:14px;font-weight:800;color:var(--c2);margin-top:2px}
.si span{display:block;color:var(--ink2);font-size:15.5px;line-height:1.38;margin-top:3px}
.si em{font-style:normal;font-size:12px;font-weight:900;background:var(--mist);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px;color:var(--ink2);letter-spacing:.02em}
.si .lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.si .lk a{font-size:14.5px;font-weight:800;border:1.5px solid var(--line);border-radius:99px;padding:3px 11px;text-decoration:none;color:var(--ink)}
.si .lk a:hover{border-color:var(--ink)}
.allk{display:inline-block;margin-top:18px;font-weight:800;font-size:16.5px}
.mbig{position:relative;display:block;height:300px;margin-top:22px;border-radius:var(--r);border:2px solid var(--line);background:#e5ecd9;overflow:hidden;text-decoration:none;color:var(--ink)}
.mbig:hover{border-color:var(--ink)}
.mbig b{position:absolute;left:16px;bottom:16px;background:var(--ink);color:#fff;font-weight:900;font-size:17px;border-radius:99px;padding:9px 18px}
.places{margin-top:18px;display:grid;gap:12px}
.places h2{font-size:19px;margin-bottom:6px}
.places .pick a{font-size:15.5px;padding:6px 14px}
.hint{color:var(--ink2);font-size:15.5px;margin-top:16px;max-width:820px}
.shelf .kxline{margin-top:22px}
.stop{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:var(--r);padding:16px 22px;margin:4px 0 40px}
.stop .win{flex:none;width:54px;height:40px;border-radius:7px;background:var(--ink);position:relative}
.stop .win::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#566067;border-radius:7px 7px 0 0}
.stop .win::after{content:"×";position:absolute;right:5px;top:-5px;color:#fff;font-size:13px;font-weight:900}
.stop b{font-weight:900}
footer{background:var(--ink);color:#C9D1CD;font-size:14.5px;padding:30px 0 34px;line-height:1.55}
footer h3{color:#fff;font-size:16px;margin-bottom:10px}
footer ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:5px 32px}
footer a{color:#fff}
footer .fin{margin-top:16px;padding-top:14px;border-top:1px solid #3A4348;display:flex;gap:8px 24px;flex-wrap:wrap;color:#9AA5A0}

/* ===== sample pages: copy of the Kiwix viewer (kiwix-serve 3.8.1 taskbar.css) ===== */
.kx{position:sticky;top:0;z-index:30;display:flex;align-items:flex-start;background:#f4f6f8;border-bottom:1px solid #aaa;padding:5px;font:400 16px Arial,"Liberation Sans",Helvetica,sans-serif;color:#000}
.kxc{flex:1;max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center}
.kxb{display:flex}
.kxb a{display:block;text-decoration:none;margin-right:5px}
.kxb .kbtn{height:30px;padding:4px 6px;max-width:30ch;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.kxs{margin-left:auto;width:200px;position:relative;height:30px}
.kxs label{position:absolute;left:5px;top:0;line-height:30px;font-size:14px;z-index:1}
.kxs input{width:100%;height:30px;border:1px solid #b5b2b2;border-radius:3px;background:#fff;padding:2px 2px 2px 27px;font:400 16px Arial,"Liberation Sans",Helvetica,sans-serif;text-overflow:ellipsis}
.kxs input::placeholder{color:#a0a0a0}
.kxt{display:none}
.kxcaret{display:none;height:30px;cursor:pointer}
.kxcaret img{height:30px;width:30px;transition:.1s}
.kxl{flex:none;cursor:pointer}
.kxl img{width:30px;height:30px;display:block}
.mock{position:fixed;left:12px;bottom:12px;z-index:60;background:var(--warn);border:1.5px solid #D9A93A;color:#5C4000;font:800 13px/1.2 var(--f);padding:6px 12px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.18);letter-spacing:.02em;max-width:calc(100vw - 24px)}
.mock span{font-weight:700;letter-spacing:0}
.kframe{display:block;width:100%;border:0;height:calc(100vh - 41px);background:#fff}

/* article page, styled like the Wikipedia ZIMs (Vector 2022 in Kiwix) */
.zim{max-width:980px;margin:0 auto;padding:4px 16px 70px;font:400 16px/1.6 sans-serif;color:#202122}
.zim h1{font:400 28.8px/1.3 "Linux Libertine",Georgia,Times,"Source Serif 4",serif;letter-spacing:0;border-bottom:1px solid #a2a9b1;margin:2px 0 18px;padding-bottom:2px}
.zim h2{font:400 24px/1.3 "Linux Libertine",Georgia,Times,"Source Serif 4",serif;letter-spacing:0;border-bottom:1px solid #a2a9b1;margin:22px 0 10px;padding-bottom:2px;overflow:hidden}
.zim p{margin:8px 0 12px}
.zim a{color:#3366cc;text-decoration:none}
.zim a:hover{text-decoration:underline}
.zim ul{margin:4px 0 12px 22px;padding:0}
.zim li{margin-bottom:3px}
.zim .ibx{float:right;clear:right;width:317px;margin:4px 0 16px 20px;border:1px solid #a2a9b1;background:#f8f9fa;padding:5px;font-size:14px;line-height:1.5}
.zim .ibx .t{font-weight:700;font-size:17.5px;text-align:center;padding:3px 0 5px;line-height:1.3}
.zim .ibx img{width:250px;margin:0 auto}
.zim .ibx .cap{text-align:center;font-size:13.5px;padding:3px 8px 6px}
.zim .ibx table{width:100%;border-collapse:collapse;border-top:1px solid #c8ccd1}
.zim .ibx th{text-align:left;vertical-align:top;padding:3px 6px;width:104px;font-weight:700}
.zim .ibx td{padding:3px 6px;vertical-align:top}
.zim .crop{position:relative;width:250px;height:160px;margin:0 auto;border:1px solid #c8ccd1;background-repeat:no-repeat}
.zim .crop i{position:absolute;left:119px;top:74px;width:12px;height:12px;border-radius:50%;background:#d33;border:2px solid #fff;box-shadow:0 0 0 1px #d33}
.zim .cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px}
.zim .box{border:1px solid #a2a9b1;padding:2px 14px 8px;margin-bottom:16px}
.zim .box h2{margin-top:8px}
.zim .mnote{clear:both;margin-top:30px;padding-top:10px;border-top:1px solid #c8ccd1;font-size:13.5px;color:#54595d}
.kres{padding:10px 8px 60px;font:400 16px/1.15 Arial,"Liberation Sans",Helvetica,sans-serif;color:#000}
.kres .hd{font-size:17px;margin:0 0 14px}
.kres .r{margin:0 0 16px}
.kres .r a{color:#1a0dab;text-decoration:underline;font-size:17px}
.kres .r p{margin:3px 0}
.kres .r cite{display:block;font-style:normal;color:#666}

/* map page: capture of the real Kiwix maps viewer (Maps2ZIM + MapLibre) */
.kmap{position:relative;overflow:hidden;height:calc(100vh - 41px);min-height:420px;background:#e5ecd9;cursor:grab;touch-action:none;user-select:none}
.kmap.drag{cursor:grabbing}
.minner{position:absolute;left:0;top:0;transform-origin:0 0}
.minner.anim{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.minner img{max-width:none;display:block;pointer-events:none}
.mlq{position:absolute;left:10px;top:10px;width:29px;height:29px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.1);font:400 15px Arial,sans-serif;color:#333}
.mlscale{position:absolute;right:10px;bottom:36px;border:2px solid #333;border-top:0;background:rgba(255,255,255,.75);color:#333;font:10px/1.4 "Helvetica Neue",Arial,Helvetica,sans-serif;padding:0 5px}
.mlattr{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.75);border-radius:12px;padding:2px 26px 2px 8px;font:12px/18px "Helvetica Neue",Arial,Helvetica,sans-serif;color:rgba(0,0,0,.75);max-width:calc(100% - 20px)}
.mlattr i{position:absolute;right:4px;top:2px;width:18px;height:18px;border-radius:50%;background:#000;color:#fff;font:700 11px/18px Georgia,serif;text-align:center}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;font-size:15.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .tiles{grid-template-columns:1fr 1fr;gap:12px;padding-top:22px}
  .tg{grid-template-columns:1fr 1fr}
  .mcard .steps{grid-template-columns:1fr}
  .mcard .steps li{grid-template-columns:44px 1fr;gap:14px}
  .mcard .notes{grid-template-columns:1fr}
  .card .sizes{columns:1}
  .zim .cols{grid-template-columns:1fr}
  footer ul{grid-template-columns:1fr}
}
@media (max-width:700px){ .where{grid-template-columns:1fr} .mbig{height:220px} }
@media (max-width:645px){ .kxs{width:36%} .mlattr{padding:0;width:24px;height:24px} .mlattr span{display:none} .mlattr i{right:3px;top:3px} .mlscale{bottom:40px} }
@media (max-width:560px){
  body{font-size:16.5px}
  .wrap{padding:0 16px}
  .top .wrap{gap:8px;height:58px}
  .logo svg{height:24px}
  .badge{font-size:12.5px;padding:6px 10px}
  .badge .long{display:none}
  .lang button{padding:5px 8px;font-size:13px}
  .hero{padding:28px 0 24px}
  .hero .sub{font-size:16.5px}
  .search input{font-size:17px;padding:14px 8px 14px 46px}
  .search>.ico{left:15px}
  .search button{padding:0 16px;font-size:16px}
  .where button{padding:11px 13px;gap:11px}
  .where button>.ico{width:26px;height:26px}
  .where b{font-size:17.5px}
  .where small,.where .mobtip small{font-size:15.5px}
  .where u{padding:4px 10px;font-size:14.5px}
  .mcard{padding:18px 14px 16px}
  .mcard h2{font-size:21px}
  .tg{grid-template-columns:1fr}
  .tryx>h2,.shelf h1{font-size:24px}
  .shelf h1 .ib{width:44px;height:44px;border-radius:13px}
  .shelf h1 .ib .ico{width:24px;height:24px}
  .shelf .lead{font-size:16.5px}
  .sg{grid-template-columns:1fr}
  .tile{padding:16px 14px;min-height:0}
  .tile .ib{width:48px;height:48px;border-radius:14px}
  .tile .ib .ico{width:26px;height:26px}
  .tile h2{font-size:20px}
  .tile p{font-size:14.5px}
  .tile .go{display:none}
  .kxline{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;font-size:16px}
  .card{padding:20px 16px}
  .steps li,.notes li{grid-template-columns:38px 1fr;gap:12px;padding:12px}
  .steps li::before,.notes li .ni{width:38px;height:38px;font-size:18px}
  .notes li{font-size:16.5px}
  .stop{padding:14px 16px}
  .zim .ibx{float:none;width:auto;margin:0 0 16px}
  .mock span{display:none}
}
@media (max-width:419px){
  .kxcaret{display:inline-block;margin-right:6px}
  .kxs{width:80%;margin-left:0}
  .kxb{display:none;order:3;width:100%;padding-top:5px}
  .kxt:checked~.kxc .kxb{display:flex}
  .kxt:checked~.kxc .kxcaret img{transform:rotate(-180deg)}
}
@media print{.top,.kx,.mock,footer{display:none}}

idth: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 18px; }\n.qr { display: flex; gap: 16px; align-items: center; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0 14px; break-inside: avoid; }\n.qr svg { width: 120px; height: 120px; flex: none; }\n.qr .url { font-size: 13px; color: var(--muted); word-break: break-all; }\n.note { font-size: 15px; color: var(--muted); }\n.kbd { font-family: \"DejaVu Sans Mono\", monospace; background: #eef0f3; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: .92em; white-space: nowrap; }\ntable { border-collapse: collapse; width: 100%; margin: 8px 0 14px; font-size: 15px; }\nth, td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 6px 8px; }\nth { background: #f1f3f6; }\n.toc a { display: block; padding: 10px 14px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; }\n.toc a span { display: block; font-weight: 400; color: var(--muted); font-size: 15px; }\nfooter { margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }\n.page { break-after: page; page-break-after: always; }\nsection.page:last-of-type { break-after: auto; page-break-after: auto; }\n.device { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }\n.device .ico { font-size: 34px; line-height: 1; }\n@media print {\n  @page { size: A4; margin: 13mm 14mm 14mm; }\n  body { padding: 0; font-size: 12.5pt; }\n  h1 { font-size: 24pt; } h2 { font-size: 16pt; } h3 { font-size: 13.5pt; }\n  a { color: var(--ink); text-decoration: none; }\n  .noprint { display: none; }\n}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"brand\">Offlinka · Nouzové příručky<\/div>\n<h1>První pomoc – rychlé karty<\/h1>\n<p class=\"sub\">Deset situací, kdy jde o minuty. Vytiskněte si je a mějte je u lékárničky.<\/p>\n\n<div class=\"review\">PRACOVNÍ VERZE – text ještě čeká na kontrolu záchranářem. Nenahrazuje kurz první pomoci. Vždy platí pokyny operátora tísňové linky.<\/div>\n\n<div class=\"call\">\n  <div><b>155<\/b>záchranná služba<\/div>\n  <div><b>112<\/b>tísňové volání v celé EU<\/div>\n  <div><b>150<\/b>hasiči<\/div>\n  <div><b>158<\/b>policie<\/div>\n<\/div>\n\n<div id=\"volani\" class=\"card red\">\n  <h3>1 · Nejdřív bezpečí, pak volejte<\/h3>\n  <ol>\n    <li>Rozhlédněte se: hrozí nebezpečí vám nebo postiženému (provoz, oheň, proud)? Nejdřív sebe a jeho dostaňte do bezpečí.<\/li>\n    <li>Volejte <b>155<\/b> (nebo 112). Řekněte <b>co se stalo, kde jste, kolik je zraněných<\/b> a své číslo.<\/li>\n    <li>Zapněte hlasitý odposlech a <b>nezavěšujte první<\/b>. Operátor vás provede krok za krokem.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"resuscitace\" class=\"card red\">\n  <h3>2 · Nereaguje a nedýchá normálně → resuscitace<\/h3>\n  <p class=\"when\">Oslovte ho nahlas, zatřeste mu rameny. Zakloňte hlavu a nejvýš 10 vteřin sledujte dech. Ojedinělé „lapavé“ nádechy nejsou normální dýchání.<\/p>\n  <ol>\n    <li>Volejte <b>155<\/b>, telefon dejte na hlasitý odposlech. Pošlete někoho pro <b>AED<\/b> (defibrilátor), pokud je poblíž.<\/li>\n    <li>Klekněte si vedle hrudníku. Dlaně na sebe doprostřed hrudníku.<\/li>\n    <li>Stlačujte propnutýma rukama <b>do hloubky 5–6 cm<\/b>, tempem <b>100–120 za minutu<\/b>. Nepřerušujte.<\/li>\n    <li>Umíte-li to a chcete: po 30 stlačeních 2 vdechy. Když ne, stlačujte bez přestávky – i to pomáhá.<\/li>\n    <li>Jakmile je AED na místě, zapněte ho a dělejte, co říká hlas přístroje.<\/li>\n    <li>Pokračujte, dokud nepřijedou záchranáři, nezačne normálně dýchat, nebo už nemůžete. Jste-li dva, střídejte se každé 2 minuty.<\/li>\n  <\/ol>\n  <p class=\"note\">Dítě: pokud jste se to učili, začněte 5 vdechy a pak 15 stlačení : 2 vdechy, hloubka asi třetina hrudníku. Pokud ne, postupujte jako u dospělého – jakákoli resuscitace je lepší než žádná.<\/p>\n<\/div>\n\n<div id=\"bezvedomi\" class=\"card\">\n  <h3>3 · Nereaguje, ale dýchá normálně<\/h3>\n  <ol>\n    <li>Otočte ho do <b>zotavovací polohy na bok<\/b>: hlava zakloněná, ústa směřují k zemi, aby mohl odtékat zvratek.<\/li>\n    <li>Volejte <b>155<\/b>.<\/li>\n    <li>Do příjezdu pomoci <b>pořád kontrolujte dech<\/b>. Přestane-li normálně dýchat → karta 2.<\/li>\n    <li>Přikryjte ho, ať neprochladne.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"krvaceni\" class=\"card red\">\n  <h3>4 · Silné krvácení<\/h3>\n  <ol>\n    <li>Tlačte <b>přímo na ránu<\/b> – nejlépe přes čistou látku nebo obvaz, ruku si chraňte rukavicí nebo sáčkem.<\/li>\n    <li>Tlačte silně a nepřetržitě. Prosákne-li obvaz, <b>nesundávejte ho<\/b>, přidejte další vrstvu a tlačte dál.<\/li>\n    <li>Volejte <b>155<\/b>.<\/li>\n    <li>Pokud život ohrožující krvácení z ruky nebo nohy tlakem nejde zastavit a máte <b>škrtidlo<\/b>: přiložte ho 5–7 cm nad ránu (ne přes kloub), utahujte, dokud krvácení nepřestane, a zapište čas přiložení.<\/li>\n    <li>Postiženého uložte, přikryjte a uklidňujte.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"duseni\" class=\"card red\">\n  <h3>5 · Dušení – něco zaskočilo<\/h3>\n  <ol>\n    <li>Pokud kašle, <b>povzbuzujte ho ke kašli<\/b>. Nic víc nedělejte.<\/li>\n    <li>Nemůže kašlat, mluvit ani dýchat: předkloňte ho a dejte <b>5 úderů<\/b> dlaní mezi lopatky.<\/li>\n    <li>Nepomůže-li to: <b>5 stlačení nadbřišku<\/b> – stoupněte si za něj, pěst nad pupek, druhou rukou ji chytněte a prudce táhněte dovnitř a nahoru.<\/li>\n    <li>Střídejte 5 úderů a 5 stlačení. Volejte <b>155<\/b>.<\/li>\n    <li>Ztratí-li vědomí → karta 2 (resuscitace).<\/li>\n  <\/ol>\n  <p class=\"note\">Kojenec do 1 roku: položte ho bříškem na předloktí hlavou dolů, 5 úderů mezi lopatky, pak na záda a 5 stlačení hrudníku dvěma prsty. <span class=\"dont\">Nikdy nestlačujte bříško kojence.<\/span><\/p>\n<\/div>\n\n<div id=\"popaleniny\" class=\"card\">\n  <h3>6 · Popálenina<\/h3>\n  <ol>\n    <li>Hned chlaďte <b>tekoucí vlažnou až studenou vodou (ne ledovou) aspoň 20 minut<\/b>.<\/li>\n    <li>Sundejte prstýnky, hodinky a oblečení, které nepřilnulo k ráně.<\/li>\n    <li>Zakryjte čistým obvazem nebo potravinovou fólií.<\/li>\n    <li>Volejte <b>155<\/b> při velké ploše, popálení obličeje, rukou, rozkroku, u malých dětí, starších lidí, po úrazu elektřinou nebo chemikálií.<\/li>\n  <\/ol>\n  <p class=\"dont\">Nepropichujte puchýře, nemažte ránu krémem, olejem ani máslem. U dětí a velkých ploch hlídejte, aby neprochladly.<\/p>\n<\/div>\n\n<div id=\"mrtvice\" class=\"card red\">\n  <h3>7 · Mrtvice (cévní mozková příhoda)<\/h3>\n  <p class=\"when\">Rychlý test: <b>Úsměv · Ruce · Řeč<\/b><\/p>\n  <ul>\n    <li><b>Úsměv<\/b> – visí jeden koutek úst?<\/li>\n    <li><b>Ruce<\/b> – udrží obě natažené ruce? Jedna klesá?<\/li>\n    <li><b>Řeč<\/b> – mluví nesrozumitelně, plete slova?<\/li>\n  <\/ul>\n  <ol>\n    <li>Kterýkoli příznak → <b>hned 155<\/b>. Každá minuta rozhoduje.<\/li>\n    <li>Zapamatujte si <b>čas, kdy příznaky začaly<\/b> – záchranáři se na něj zeptají.<\/li>\n    <li>Nedávejte mu jíst ani pít.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"infarkt\" class=\"card red\">\n  <h3>8 · Bolest na hrudi (možný infarkt)<\/h3>\n  <ol>\n    <li>Posaďte ho do pohodlné polohy, uvolněte oděv, nenechte ho chodit.<\/li>\n    <li>Volejte <b>155<\/b>. Operátor vám řekne, zda a jaký lék podat.<\/li>\n    <li>Zůstaňte u něj. Přestane-li reagovat a normálně dýchat → karta 2.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"krece\" class=\"card\">\n  <h3>9 · Křeče (epileptický záchvat)<\/h3>\n  <ol>\n    <li>Odstraňte kolem něj tvrdé a ostré předměty, pod hlavu dejte něco měkkého.<\/li>\n    <li><span class=\"dont\">Nedržte ho a nic mu nedávejte do úst.<\/span> Změřte, jak dlouho záchvat trvá.<\/li>\n    <li>Po záchvatu ho otočte na bok (karta 3) a nechte ho vydýchat.<\/li>\n    <li>Volejte <b>155<\/b>, pokud křeče trvají déle než 5 minut, opakují se, je to první záchvat, došlo ke zranění, je ve vodě nebo je těhotná.<\/li>\n  <\/ol>\n<\/div>\n\n<div id=\"podchlazeni-otrava\" class=\"card\">\n  <h3>10 · Podchlazení a otrava<\/h3>\n  <p><b>Podchlazení:<\/b> dostaňte ho do tepla a sucha, převlékněte do suchého, zabalte i hlavu. Je-li při vědomí a polyká, dejte teplý slazený nápoj, <span class=\"dont\">nikdy alkohol<\/span>. Je zmatený, ospalý nebo přestal třást → <b>155<\/b>.<\/p>\n  <p><b>Otrava<\/b> (léky, houby, chemie, oxid uhelnatý): volejte <b>155<\/b>. Bez naléhavých příznaků poradí <b>Toxikologické informační středisko: 224 919 293 nebo 224 915 402<\/b> (nonstop). <span class=\"dont\">Nevyvolávejte zvracení.<\/span> Obal nebo zbytek látky vezměte s sebou. Při podezření na oxid uhelnatý (bolest hlavy u více lidí, kamna, agregát) hned všichni ven na vzduch.<\/p>\n<\/div>\n\n<footer>\n  Offlinka · První pomoc – rychlé karty · verze 2026-11-16 · Pracovní verze, čeká na kontrolu záchranářem.<br>\n  Text: Ollcee s.r.o., licence CC BY-SA 4.0. Sestaveno podle obecně dostupných zásad laické první pomoci (Evropská rada pro resuscitaci). Podrobnosti najdete ve WikiSkriptech na této flashce.\n<\/footer>\n<\/main>\n<\/body>\n<\/html>\n","vypadek-proudu":"<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Výpadek proudu – co připravit<\/title>\n<style>\n/* Shared style for the drive's own documents (HTML inside the ZIM and the PDFs). */\n:root { --ink:#16181d; --muted:#5a6070; --line:#d9dce3; --accent:#0b6e4f; --warn-bg:#fff4d6; --warn:#8a5a00; --red:#b3261e; --card:#f6f7f9; }\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody { margin: 0; padding: 18px 16px 40px; font-family: \"Noto Sans\", \"DejaVu Sans\", \"Segoe UI\", Roboto, Arial, sans-serif; color: var(--ink); background:#fff; font-size: 17px; line-height: 1.45; }\nmain { max-width: 820px; margin: 0 auto; }\nh1 { font-size: lají i rozhlasem.<\/li>\n    <li><b>Pitnou vodu<\/b> a jídlo, které nepotřebuje vařit ani chladit.<\/li>\n    <li><b>Hotovost<\/b> – platební terminály bez proudu nefungují.<\/li>\n    <li><b>Důležitá čísla na papíře<\/b> a vytištěné karty první pomoci z této flashky.<\/li>\n    <li><b>Nabitý notebook<\/b> – na baterii otevře celou tuto knihovnu.<\/li>\n  <\/ul>\n<\/div>\n\n<div class=\"card\">\n  <h3>Když proud vypadne<\/h3>\n  <ol>\n    <li>Podívejte se, zda nesvítí sousedé. Pokud ano, zkontrolujte <b>jističe<\/b> ve svém bytě či domě.<\/li>\n    <li>Výpadek nahlaste na <b>poruchovou linku svého distributora<\/b> (číslo je na faktuře za elektřinu).<\/li>\n    <li>Vypněte citlivé spotřebiče (počítač, televizi); jednu lampu nechte zapnutou, ať poznáte návrat proudu.<\/li>\n    <li><b>Lednici a mrazák neotvírejte<\/b> zbytečně – déle udrží chlad.<\/li>\n    <li>Mobil šetřete: snižte jas, vypněte nepotřebné aplikace, volejte jen v nutnosti.<\/li>\n    <li>Zeptejte se starších sousedů, zda něco nepotřebují.<\/li>\n  <\/ol>\n<\/div>\n\n<div class=\"card red\">\n  <h3>Bezpečí<\/h3>\n  <ul>\n    <li><span class=\"dont\">Nikdy nepoužívejte agregát, gril ani plynový ohřívač uvnitř<\/span> – hrozí otrava oxidem uhelnatým, který necítíte. Bolest hlavy a nevolnost u více lidí naráz → všichni ven a volejte 155.<\/li>\n    <li>Svíčky a petrolejky jen pod dohledem, dál od záclon a dětí.<\/li>\n    <li>Při ohrožení života volejte <b>112<\/b> nebo <b>155<\/b>; mobilní síť obvykle funguje ještě nějakou dobu po výpadku proudu, ale nemusí.<\/li>\n  <\/ul>\n<\/div>\n\n<footer>Offlinka · Výpadek proudu – co připravit · verze 2026-11-16 · text Ollcee s.r.o., CC BY-SA 4.0 · pracovní verze<\/footer>\n<\/main>\n<\/body>\n<\/html>\n","jak-pouzivat":"<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Jak používat tuto flashku<\/title>\n<style>\n/* Shared style for the drive's own documents (HT ss=\"sub\">Krátký návod pro počítač i mobil. Podrobné kroky s obrázky jsou v PDF „1 ZAČNI ZDE“.<\/p>\n\n<h2>Co je kde<\/h2>\n<table>\n  <tr><th>Na flashce<\/th><th>K čemu<\/th><\/tr>\n  <tr><td><b>1 ZAČNI ZDE.pdf<\/b><\/td><td>návod pro každé zařízení, QR kódy na aplikaci Kiwix<\/td><\/tr>\n  <tr><td><b>2 SPUSTIT – Windows / Mac / Linux<\/b><\/td><td>dvojklik otevře knihovnu v prohlížeči<\/td><\/tr>\n  <tr><td><b>3 Nouzové příručky<\/b><\/td><td>PDF: první pomoc, výpadek proudu, tento návod<\/td><\/tr>\n  <tr><td><b>Knihovna<\/b><\/td><td>Wikipedie, mapy, slovník, knihy, hry (soubory .zim)<\/td><\/tr>\n  <tr><td><b>Telefon<\/b><\/td><td>menší soubory pro mobily, které musí kopírovat<\/td><\/tr>\n  <tr><td><b>Aplikace<\/b><\/td><td>program Kiwix pro Windows, Mac, Linux, Android + zdrojové kódy<\/td><\/tr>\n  <tr><td><b>Licence<\/b><\/td><td>odkud obsah je, autoři a licence<\/td><\/tr>\n<\/table>\n\n<h2>Počítač<\/h2>\n<ol class=\"steps\">\n  <li>Zapojte flashku a otevřete ji.<\/li>\n  <li>Dvakrát klikněte na <b>2 SPUSTIT<\/b> pro svůj systém.<\/li>\n  <li>V prohlížeči se otevře úvodní stránka knihovny. Hledejte, nebo klikněte na dlaždici.<\/li>\n  <li>Hotovo? Zavřete černé okno „Offline knihovna“ (na Macu okno Terminálu). Pak flashku bezpečně odeberte.<\/li>\n<\/ol>\n<p class=\"note\">Knihovna běží jen ve vašem počítači na adrese <span class=\"kbd\">http://127.0.0.1:8765<\/span>. Nic se neposílá do internetu. Zavřete-li omylem prohlížeč, tuto adresu stačí otevřít znovu.<\/p>\n\n<h2>Mobil<\/h2>\n<p>V mobilu knihovnu otevírá bezplatná aplikace <b>Kiwix<\/b>. Nainstalujte si ji, dokud máte internet – návod je v PDF <b>Jak to otevřít v mobilu<\/b>.<\/p>\n\n<h2>Když něco nejde<\/h2>\n<ul>\n  <li><b>Prohlížeč píše „Nelze se připojit“:<\/b> počkejte pár vteřin a stránku obnovte (F5). Velké soubory se z pomalého USB načítají déle.<\/li>\n  <li><b>Windows ukáže modré okno ochrany:<\/b> Další informace → Přesto spustit.<\/li>\n  <li><b>Mac nechce spustit 2 SPUSTIT:<\/b> Nastavení systému → Soukromí a zabezpečení → Přesto otevřít. Nebo použijte Kiwix z App Storu.<\/li>\n  <li><b>Linux otevře skript jako text:<\/b> pravým tlačítkem → Spustit jako program.<\/li>\n  <li><b>Flashka se neukáže:<\/b> zkuste jiný USB port nebo redukci USB-C ↔ USB-A.<\/li>\n<\/ul>\n\n<h2>Co smíte<\/h2>\n<ul>\n  <li>Obsah <b>smíte kopírovat a sdílet<\/b> – třeba celou flashku zálohovat do počítače. Podmínky a autoři jsou ve složce Licence.<\/li>\n  <li>Na volné místo si můžete uložit <b>vlastní dokumenty<\/b> (kopie dokladů, kontakty, fotky).<\/li>\n  <li><b>Nemažte a nepřejmenovávejte<\/b> soubory ve složkách Knihovna a Aplikace, jinak 2 SPUSTIT nemusí fungovat.<\/li>\n<\/ul>\n\n<footer>Offlinka · Jak používat tuto flashku · verze 2026-11-16 · text Ollcee s.r.o., CC BY-SA 4.0<\/footer>\n<\/main>\n<\/body>\n<\/html>\n","jak-v-mobilu":"<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Jak to otevřít v mobilu<\/title>\n<style>\n/* Shared style for the drive's own documents (HTML inside the ZIM and the PDFs). */\n:root { --ink:#16181d; --muted:#5a6070; --line:#d9dce3; --accent:#0b6e4f; --warn-bg:#fff4d6; --warn:#8a5a00; --red:#b3261e; --card:#f6f7f9; }\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody { margin: 0; padding: 18px 16px 40px; font-family: \"Noto Sans\", \"DejaVu Sans\", \"Segoe UI\", Roboto, Arial, sans-serif; color: var(--ink); background:#fff; font-size: 17px; line-height: 1.45; }\nmain { max-width: 820px; margin: 0 auto; }\nh1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; }\nh2 { font-size: 22px; margin: 26px 0 8px; }\nh3 { font-size: 19px; margin: 0 0 6px; }\np { margin: 6px 0 10px; }\na { color: var(--accent); }\nol, ul { padding-left: 24px; margin: 6px 0 12px; }\nli { margin: 4px 0; }\n.sub { color: var(--muted); margin: 0 0 14px; }\n.brand { font-weight: 800; letter-spacing: .02em; color: var(--accent); text-tr cument.querySelector(\".score-container\");\n  this.bestContainer    = document.querySelector(\".best-container\");\n  this.messageContainer = document.querySelector(\".game-message\");\n\n  this.score = 0;\n}\n\nHTMLActuator.prototype.actuate = function (grid, metadata) {\n  var self = this;\n\n  window.requestAnimationFrame(function () {\n    self.clearContainer(self.tileContainer);\n\n    grid.cells.forEach(function (column) {\n      column.forEach(function (cell) {\n        if (cell) {\n          self.addTile(cell);\n        }\n      });\n    });\n\n    self.updateScore(metadata.score);\n    self.updateBestScore(metadata.bestScore);\n\n    if (metadata.terminated) {\n      if (metadata.over) {\n        self.message(false); // You lose\n      } else if (metadata.won) {\n        self.message(true); // You win!\n      }\n    }\n\n  });\n};\n\n// Continues the game (both restart and keep playing)\nHTMLActuator.prototype.continueGame = function () {\n  this.clearMessage();\n};\n\nHTMLActuator.prototype.clearContainer = function (container) {\n  while (container.firstChild) {\n    container.removeChild(container.firstChild);\n  }\n};\n\nHTMLActuator.prototype.addTile = function (tile) {\n  var self = this;\n\n  var wrapper   = document.createElement(\"div\");\n  var inner     = document.createElement(\"div\");\n  var position  = tile.previousPosition || { x: tile.x, y: tile.y };\n  var positionClass = this.positionClass(position);\n\n  // We can't use classlist because it somehow glitches when replacing classes\n  var classes = [\"tile\", \"tile-\" + tile.value, positionClass];\n\n  if (tile.value > 2048) classes.push(\"tile-super\");\n\n  this.applyClasses(wrapper, classes);\n\n  inner.classList.add(\"tile-inner\");\n  inner.textContent = tile.value;\n\n  if (tile.previousPosition) {\n    // Make sure that the tile gets rendered in the previous position first\n    window.requestAnimationFrame(function () {\n      classes[2] = self.positionClass({ x: tile.x, y: tile.y ontainer.classList.remove(\"game-won\");\n  this.messageContainer.classList.remove(\"game-over\");\n};\n<\/script>\n  <script>function Grid(size, previousState) {\n  this.size = size;\n  this.cells = previousState ? this.fromState(previousState) : this.empty();\n}\n\n// Build a grid of the specified size\nGrid.prototype.empty = function () {\n  var cells = [];\n\n  for (var x = 0; x < this.size; x++) {\n    var row = cells[x] = [];\n\n    for (var y = 0; y < this.size; y++) {\n      row.push(null);\n    }\n  }\n\n  return cells;\n};\n\nGrid.prototype.fromState = function (state) {\n  var cells = [];\n\n  for (var x = 0; x < this.size; x++) {\n    var row = cells[x] = [];\n\n    for (var y = 0; y < this.size; y++) {\n      var tile = state[x][y];\n      row.push(tile ? new Tile(tile.position, tile.value) : null);\n    }\n  }\n\n  return cells;\n};\n\n// Find the first available random position\nGrid.prototype.randomAvailableCell = function () {\n  var cells = this.availableCells();\n\n  if (cells.length) {\n    return cells[Math.floor(Math.random() * cells.length)];\n  }\n};\n\nGrid.prototype.availableCells = function () {\n  var cells = [];\n\n  this.eachCell(function (x, y, tile) {\n    if (!tile) {\n      cells.push({ x: x, y: y });\n    }\n  });\n\n  return cells;\n};\n\n// Call callback for every cell\nGrid.prototype.eachCell = function (callback) {\n  for (var x = 0; x < this.size; x++) {\n    for (var y = 0; y < this.size; y++) {\n      callback(x, y, this.cells[x][y]);\n    }\n  }\n};\n\n// Check if there are any cells available\nGrid.prototype.cellsAvailable = function () {\n  return !!this.availableCells().length;\n};\n\n// Check if the specified cell is taken\nGrid.prototype.cellAvailable = function (cell) {\n  return !this.cellOccupied(cell);\n};\n\nGrid.prototype.cellOccupied = function (cell) {\n  return !!this.cellContent(cell);\n};\n\nGrid.prototype.cellContent = function (cell) {\n  if (this.withinBounds(cell)) {\n    return this.cells[cell.x][cell.y /* ============ CURATED SHELVES ============
   Each tile opens a curated page in this file instead of a raw ZIM front page (the frozen Wikipedia front page lists wars).
   Links name a book key + a path inside it. Paths were checked on the real drive (kiwix-serve 3.8.1, build/live-test.json).
   On the drive the books are looked up in kiwix-serve's catalog, so a bundle without a book simply hides its links. */
const BOOKS = {wcs:/^wikipedia_cs_/, wsk:/^wikipedia_sk_/, ws:/^wikisource_cs_/, wv:/^wikivoyage_en_/, mcz:/^maps_en_czech-republic/, msk:/^maps_en_slovakia/, aid:/^offlinka_cs_prirucky/, hry:/^offlinka_mul_hry/};
// Wikipedia shelf: [Czech Wikipedia path, Slovak Wikipedia path, sample page]; titles and teasers are in T.*.wsh
const WSHELF = [['Sněžka','Sněžka','#/wiki/snezka'],['Krkonoše','Krkonoše'],['Vysoké_Tatry','Vysoké_Tatry_(pohorie)'],['Staroměstský_orloj','Pražský_orloj'],['Jan_Amos_Komenský','Jan_Amos_Komenský','#/wiki/komensky'],
  ['Robot','Robot'],['Dinosauři','Dinosaury'],['Polární_záře','Polárna_žiara'],['Morseova_abeceda','Medzinárodná_Morseova_abeceda'],['Polárka','Polárka']];
// Knihovna shelf: Czech Wikisource [title, author, path]; teasers in T.*.ksh
const KSHELF = [['Babička','Božena Němcová','Babička'],['Máj','Karel Hynek Mácha','Máj_(Mácha)'],['Kytice','Karel Jaromír Erben','Kytice_z_pověstí_národních'],['Povídky malostranské','Jan Neruda','Povídky_malostranské'],
  ['R.U.R.','Karel Čapek','R.U.R.'],['Devatero pohádek','Karel a Josef Čapkovi','Devatero_pohádek'],['Broučci','Jan Karafiát','Broučci_(1919)'],['Zahradníkův rok','Karel Čapek','Zahradníkův_rok'],['Měl jsem psa a kočku','Karel Čapek','Měl_jsem_psa_a_kočku']];
// Cestování shelf: [name cs, sk, en, country (T.*.lands), Wikivoyage path, Czech Wikipedia path, Slovak Wikipedia path]
const CSHELF = [['Krkonoše','Krkonoše','Giant Mountains',0,'Giant_Mountains_National_Park','Krkonoše','Krkonoše'],['Šumava','Šumava','Šumava',0,'Sumava','Šumava','Šumava'],
  ['Praha','Praha','Prague',0,'Prague','Praha','Praha'],['Český Krumlov','Český Krumlov','Český Krumlov',0,'Český_Krumlov','Český_Krumlov','Český_Krumlov'],
  ['Vysoké Tatry','Vysoké Tatry','High Tatras',1,'High_Tatras','Vysoké_Tatry','Vysoké_Tatry_(pohorie)'],['Bratislava','Bratislava','Bratislava',1,'Bratislava','Bratislava','Bratislava'],
  ['Vídeň','Viedeň','Vienna',2,'Vienna','Vídeň','Viedeň'],['Krakov','Krakov','Kraków',3,'Kraków','Krakov','Krakov'],['Split','Split','Split',4,'Split','Split','Split']];
// Map places: [name, book, lat, lon, zoom]. The maps viewer (Maps2ZIM) opens at #lat=…&lon=…&zoom=… (zoom ≤ 14).
const SPOTS = {
  krkonose:['Krkonoše','mcz',50.70,15.65,11], pec:['Pec pod Sněžkou','mcz',50.6917,15.7333,13], spindl:['Špindlerův Mlýn','mcz',50.7261,15.6094,13], janske:['Janské Lázně','mcz',50.6308,15.7789,13],
  praha:['Praha','mcz',50.0875,14.4214,13], brno:['Brno','mcz',49.1951,16.608,13], krumlov:['Český Krumlov','mcz',48.8109,14.3152,14],
  bratislava:['Bratislava','msk',48.144,17.1078,13], strbske:['Štrbské Pleso','msk',49.1194,20.0631,12], kosice:['Košice','msk',48.7206,21.2581,13]};
const PLACES = [[0,['praha','brno','krumlov','pec','spindl','janske']],[1,['bratislava','strbske','kosice']]];   // [country (T.*.lands), spots]
const TRYSPOTS = ['pec','spindl','janske'];   // inside the captured map, so the preview shows the real map around them
// Peaks for "Vyberte horu": [chip name, full name, height m (Wikipedia, rounded down), Czech path, Slovak path, sample page]
const PEAKS = [['Sněžka','Sněžka',1603,'Sněžka','Sněžka','#/wiki/snezka'],['Praděd','Praděd',1491,'Praděd','Praděd'],['Kriváň','Kriváň',2494,'Kriváň','Kriváň_(vrch_v_Tatrách)'],['Gerlach','Gerlachovský štít',2654,'Gerlachovský_štít','Gerlachovský_štít']];

/* ============ STATE ============ */
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs = new URLSearchParams(location.search);
let lang = ['cs','sk','en'].includes(qs.get('lang')) ? qs.get('lang') : (store.get('lang') || 'cs');
if(!T[lang]) lang='cs';
// The Kiwix viewer reads its UI language from the same localStorage key (served from the same origin),
// so its bar says "Hledat 'Wikipedie'" instead of English. Only set it once; the viewer's own picker wins later.
if(!store.get('userlang')) store.set('userlang', lang);
let L = T[lang];
let HAVE = null;                                   // LIVE: book aliases on this drive (kiwix-serve catalog); null = not known yet
let dev = innerWidth<=700 ? 'mob' : 'pc';          // "Počítač / Mobil" choice; a phone-sized screen starts on Mobil
let peak = 0, spot = TRYSPOTS[0];                  // "Vyzkoušejte hned" picks
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const num = n => (lang==='en' ? n.toFixed(1) : n.toFixed(1).replace('.',','));
const html = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
function lookup(q){
  const nq=norm(q.trim()); if(!nq) return [];
  const rows=[];
  for(const [id,k,t] of AIDMOCK) if(norm(k).includes(nq)||norm(t).includes(nq)) rows.push({h:'#/pomoc/'+id,c:'pomoc',t});
  if(norm(POWERMOCK[0]+' '+POWERMOCK[1]).includes(nq)) rows.push({h:'#/p/'+POWERMOCK[2],c:'pomoc',t:POWERMOCK[1]});
  for(const [t,id] of WTITLES[lang]) if(norm(t).includes(nq)&&rows.length<7) rows.push({h:id?'#/wiki/'+id:'',c:'wiki',t});
  rows.push({h:'#/hledat/'+encodeURIComponent(q.trim()),c:'wiki',t:L.resT+' „'+q.trim()+'“ – fulltext'});
  return rows.slice(0,8);
}

/* ============ START PAGE ============ */
function langSw(){return `<div class="lang" role="group" aria-label="Jazyk / Language">${[['cs','CZ'],['sk','SK'],['en','EN']].map(([c,n])=>`<button data-lang="${c}" aria-pressed="${c===lang}">${n}</button>`).join('')}</div>`}
function badge(){return `<span class="badge"><i></i>${L.badge}<span class="long">${L.badgeLong}</span></span>`}
function searchBox(){const ph=innerWidth<=560?L.phS:L.ph;return `<form class="search" role="search" autocomplete="off">${ico('search')}<input type="search" name="q" placeholder="${ph}" aria-label="${L.ph}"><button type="submit">${L.btn}</button><div class="sug" hidden></div></form>`}
function topbar(){return `<div class="top"><div class="wrap"><a class="logo" href="#/" aria-label="Offlinka">${LOGO}</a>${badge()}<span class="sp"></span>${langSw()}</div></div>`}
function footer(){return `<footer><div class="wrap"><h3>${L.licT}</h3><ul>${L.lic.map(x=>`<li>${x}</li>`).join('')}</ul><div class="fin">${L.fin.map(x=>`<span>${x}</span>`).join('')}</div></div></footer>`}

/* links into the books: href attribute, or '' when this drive does not carry the book (LIVE) */
function alias(k){
  const re=BOOKS[k], r=[REAL.wiki.cs,REAL.wiki.sk,REAL.mapy,REAL.pomoc,REAL.knihovna,REAL.hry,REAL.cestovani].map(x=>String(x||'').replace('/viewer#','')).find(a=>re.test(a));
  if(HAVE) return r&&HAVE.includes(r) ? r : (HAVE.find(a=>re.test(a))||null);
  return r || (k==='msk'&&/maps_en_czech-republic/.test(REAL.mapy) ? 'maps_en_slovakia' : null);
}
function bl(k, path, mock){
  if(!LIVE) return mock ? `href="${mock}"` : 'href="#" data-x';
  const a=alias(k); if(!a) return '';
  const i=path.indexOf('#'), p=i<0?path:path.slice(0,i), f=i<0?'':path.slice(i);
  return `href="${html('/viewer#'+a+'/'+p.split('/').map(encodeURIComponent).join('/')+f)}"`;
}
const wl = (cs, sk, mock) => lang==='sk' && (!LIVE||alias('wsk')) ? bl('wsk',sk,mock) : bl('wcs',cs,mock);   // Wikipedia in the page language
function sl(id){ const [,k,la,lo,z]=SPOTS[id]; return bl(k,`index.html#lat=${la}&lon=${lo}&zoom=${z}`, (TRYSPOTS.includes(id)||id==='krkonose')?'#/mapy/'+id:''); }
// where a place sits in the captured real map (css px), Web Mercator like MapLibre (512 px tiles)
function spotPx(id){ const [,,la,lo]=SPOTS[id], [clo,cla]=MAPINFO.center, ws=512*Math.pow(2,MAPINFO.zoom), my=a=>Math.log(Math.tan(Math.PI/4+a*Math.PI/360));
  return [MAPINFO.css.width/2+(lo-clo)/360*ws, MAPINFO.css.height/2-(my(la)-my(cla))*ws/(2*Math.PI)]; }
const mlPos = (id, k=1) => { const [x,y]=spotPx(id); return `left:calc(50% - ${Math.round(x*k)}px);top:calc(50% - ${Math.round(y*k)}px)`+(k===1?'':`;width:${MAPINFO.css.width*k}px;height:${MAPINFO.css.height*k}px`); };
const kxLine = (book=BOOKT[lang]) => `<p class="kxline"><span class="kxmini" aria-hidden="true"><i class="kbtn">🏠</i><i class="kbtn">${book}</i><i class="kbtn">🎲</i></span><span>${L.kx}</span></p>`;

function whereRow(){
  return `<div class="where" role="group" aria-label="${L.devAria}">
    <button class="pc" data-dev="pc" aria-pressed="${dev==='pc'}">${ico('pc')}<span><b>${L.devPc}</b><small>${L.devPcT}</small></span><span class="ok">${ico('check')}</span></button>
    <button class="mobtip" data-dev="mob" aria-pressed="${dev==='mob'}" aria-expanded="${dev==='mob'}" aria-controls="mobil">${ico('phone')}<span><b>${L.mobQ}</b><small>${L.mobT}</small></span><u>${dev==='mob'?L.mobHide:L.mobGo}</u></button></div>`;
}
function phoneCard(){
  const more = bl('aid','jak-v-mobilu.html','#/p/jak-v-mobilu');
  return `<section class="mcard" id="mobil"${dev==='mob'?'':' hidden'}><h2>${ico('phone')}${L.phoneT}</h2>
    <ol class="steps">${L.steps.map(([a,b])=>`<li><div><b>${a}</b><span>${b}</span></div></li>`).join('')}</ol>
    <h3>${L.noteT}</h3>
    <ul class="notes">${L.pnotes.map(([i,a,b])=>`<li><span class="ni">${ico(i)}</span><span><b>${a}</b> ${b}</span></li>`).join('')}</ul>
    ${more?`<a class="mmore" ${more}>${L.phoneMore}</a>`:''}</section>`;
}

/* "Vyzkoušejte hned": a mountain, a map spot, a first-aid card, a game */
function peakSvg(){
  const W=300, base=92, max=2654, step=W/PEAKS.length, h=p=>p[2]/max*70, x=i=>step*i+step/2;
  const tri=(p,i,on)=>`<path data-peak="${i}" d="M${x(i)-step*.62} ${base}L${x(i)} ${base-h(p)}L${x(i)+step*.62} ${base}Z" fill="${on?'#1FD15F':'#E6ECE8'}" stroke="${on?'#0B7A3B':'#C3CDC7'}" stroke-width="1.5" stroke-linejoin="round"/>`;
  return `<svg class="peaks" viewBox="0 0 ${W} 96" aria-hidden="true">${PEAKS.map((p,i)=>i===peak?'':tri(p,i,false)).join('')}${tri(PEAKS[peak],peak,true)}
    <text x="${x(peak)}" y="${base-h(PEAKS[peak])-7}" text-anchor="middle">${PEAKS[peak][2]} m</text><path d="M0 ${base}H${W}" stroke="#C3CDC7" stroke-width="1.5"/></svg>`;
}
function peakCard(){
  const p=PEAKS[peak], link=wl(p[3],p[4],p[5]||'');
  return `<div class="tc" id="tc-peak" style="--c2:#0B7A3B"><h3>${ico('peak')}${L.tPeak}</h3>
    <div class="pick">${PEAKS.map((q,i)=>`<button data-peak="${i}" aria-pressed="${i===peak}">${q[0]}</button>`).join('')}</div>
    ${peakSvg()}<p aria-live="polite"><b>${p[1]}.</b> ${L.peaks[peak]}</p>${link?`<a class="more" ${link}>${L.readWiki}</a>`:''}</div>`;
}
function spotCard(){
  const link=sl(spot); if(!link) return '';
  return `<div class="tc" id="tc-spot" style="--c2:#17609B"><h3>${ico('mapy')}${L.tSpot}</h3>
    <div class="pick">${TRYSPOTS.map(id=>`<button data-spot="${id}" aria-pressed="${id===spot}">${SPOTS[id][0]}</button>`).join('')}</div>
    <div class="mprev" role="img" aria-label="${SPOTS[spot][0]} (${L.mapCap})"><span class="ml" style="${mlPos(spot)}"></span><span class="cap">${L.mapCap}</span></div>
    <a class="more" ${link}>${L.openMap}</a></div>`;
}
function aidCard(){
  const items=L.aidChips.map(([id,t])=>{const h=bl('aid','prvni-pomoc.html#'+id,'#/p/prvni-pomoc/'+id);return h?`<a ${h}>${t}</a>`:''}).join('');
  return items ? `<div class="tc" style="--c2:#B4321F"><h3>${ico('pomoc')}${L.tAid}</h3><p>${L.aidL}</p><div class="pick">${items}</div><p class="warnl">${L.aidW}</p></div>` : '';
}
function gameCard(){
  const items=[['2048','2048/index.html','#/hry/2048'],['Hextris','hextris/index.html','']].map(([n,p,m])=>{const h=bl('hry',p,m);return h?`<a ${h}>${n}</a>`:''}).join(''), all=bl('hry','index.html','#/hry');
  return items ? `<div class="tc" style="--c2:#5B3BB0"><h3>${ico('hry')}${L.tGame}</h3><p>${L.games.map(([n,t])=>`<b>${n}:</b> ${t}`).join('<br>')}</p><div class="pick">${items}</div>${all?`<a class="more" ${all}>${L.allGames}</a>`:''}</div>` : '';
}

function home(){
  const tiles = Object.keys(L.tiles).map(k=>{const [t,d,ch]=L.tiles[k];const [c1,c2]=TILE_STYLE[k];
    const href = k==='pomoc'||k==='hry' ? (LIVE?REAL[k]:'#/'+k) : '#/s/'+k;   // Přežití and Hry open the drive's own Czech pages; the rest a shelf below
    return `<a class="tile" href="${href}" style="--c1:${c1};--c2:${c2}"><span class="ib">${ico(k)}</span><span class="go">${ico('go')}</span><h2>${t}</h2><p>${d}</p>${ch?`<span class="chips">${ch.map(x=>`<span>${x}</span>`).join('')}</span>`:''}</a>`}).join('');
  return topbar()+`
  <section class="hero"><div class="wrap">
    <h1>${L.h1}</h1><p class="sub">${L.sub}</p>
    ${searchBox()}
    <div class="try">${L.try} ${L.chips.map(c=>`<button data-q="${c}">${c}</button>`).join('')}</div>
    ${whereRow()}
    ${phoneCard()}
  </div></section>
  <div class="wrap">
    <nav class="tiles">${tiles}</nav>
    ${kxLine()}
    <section class="tryx"><h2>${L.tryT}</h2><div class="tg">${peakCard()}${spotCard()}${aidCard()}${gameCard()}</div></section>
    <section class="card"><h2>${ico('disk')}${L.diskT}</h2>
        <div class="bar" aria-hidden="true">${SIZES.map((s,i)=>`<i style="width:${s/DRIVE*100}%;background:${SIZE_COL[i]}"></i>`).join('')}</div>
        <ul class="sizes">${L.sizes.map((n,i)=>`<li><i style="background:${SIZE_COL[i]}"></i>${n}<b>${num(SIZES[i])} GB</b></li>`).join('')}
        <li class="free"><i></i>${L.free}<b>${L.about} 10 GB</b></li></ul></section>
    <div class="stop"><span class="win"></span><p><b>${L.stopT}</b> ${L.stop}</p></div>
  </div>`+footer();
}

/* ============ SHELVES (curated Czech page per tile) ============ */
function shelf(kind){
  if(!['wiki','mapy','knihovna','cestovani'].includes(kind)) return home();
  const [c1,c2]=TILE_STYLE[kind], li=(h,inner)=>h?`<li><a class="si" ${h}>${inner}</a></li>`:'';
  let lead='', body='';
  if(kind==='wiki'){
    lead=L.wLead;
    body=searchBox()+`<ol class="sg">${WSHELF.map(([cs,sk,mock],i)=>li(wl(cs,sk,mock||''),`<span class="n">${i+1}</span><span><b>${L.wsh[i][0]}${lang==='en'?'<em>CZ</em>':''}</b><span>${L.wsh[i][1]}</span></span>`)).join('')}</ol>`;
  } else if(kind==='knihovna'){
    lead=L.kLead; const all=bl('ws','Wikizdroje:Hlavní_strana','#/knihovna');
    body=`<ul class="sg">${KSHELF.map(([t,a,p],i)=>li(bl('ws',p,''),`<span class="n">${ico('knihovna')}</span><span><b>${t}</b><small>${a}</small><span>${L.ksh[i]}</span></span>`)).join('')}</ul>${all?`<a class="allk" ${all}>${L.kAll}</a>`:''}`;
  } else if(kind==='cestovani'){
    lead=L.cLead; const n={cs:0,sk:1,en:2}[lang];
    body=`<ul class="sg">${CSHELF.map(r=>{const g=bl('wv',r[4],''), w=wl(r[5],r[6],'');
      return g||w?`<li><div class="si"><span class="n">${ico('cestovani')}</span><span><b>${r[n]}</b><small>${L.lands[r[3]]}</small><span class="lk">${g?`<a ${g}>${L.cGuide}</a>`:''}${w?`<a ${w}>${lang==='sk'&&(!LIVE||alias('wsk'))?L.cWiki:L.cWiki.replace(/SK$/,'CZ')}</a>`:''}</span></span></div></li>`:''}).join('')}</ul>`;
  } else {
    lead=L.mLead; const big=sl('krkonose');
    body=(big?`<a class="mbig" ${big}><span class="ml" style="${mlPos('krkonose',.8)}"></span><b>${L.mBig}</b></a>`:'')+
      `<div class="places">${PLACES.map(([c,ids])=>{const ch=ids.map(id=>{const h=sl(id);return h?`<a ${h}>${SPOTS[id][0]}</a>`:''}).join('');return ch?`<div><h2>${L.lands[c]}</h2><div class="pick">${ch}</div></div>`:''}).join('')}</div><p class="hint">${L.mHint}</p>`;
  }
  return topbar()+`<main class="wrap shelf" style="--c1:${c1};--c2:${c2}"><a class="back" href="#/">${L.back}</a>
    <h1><span class="ib">${ico(kind)}</span>${L.tiles[kind][0]}</h1><p class="lead">${lead}</p>${body}${kxLine({wiki:BOOKT[lang],mapy:'Czech Republic',knihovna:'Wikizdroje',cestovani:'Wikivoyage'}[kind])}</main>`+footer();
}

/* ============ SAMPLE PAGES (copy of the Kiwix viewer) ============ */
function kxBar(book, home, q=''){
  return `<div class="kx"><input type="checkbox" class="kxt" id="kxt" hidden>
    <div class="kxc">
      <label for="kxt" class="kxcaret"><img src="${IMG.caret}" alt=""></label>
      <div class="kxb"><a href="#/" title="${L.kxHome}"><span class="kbtn">🏠</span></a><a href="${home}"><span class="kbtn">${book}</span></a><a href="#" data-x><span class="kbtn">🎲</span></a></div>
      <form class="kxs" data-book="${book}" autocomplete="off"><label>🔍</label><input type="text" value="${html(q)}" placeholder="${html(L.kxPh(book))}" aria-label="${html(L.kxPh(book))}"></form>
    </div>
    <a class="kxl" data-x title="Select UI language"><img src="${IMG.kxlang}" alt=""></a></div>`;
}
const mock = () => `<div class="mock" role="note">${L.mock}<span>${L.mockL}</span></div>`;
const links = s => s.replace(/<a>/g,'<a href="#" data-x>');

function wikiPage(id){
  const A = WIKI[id] || WIKI.komensky, W = A[lang];
  let pic = '';
  if(W.img==='kom') pic = `<img src="${IMG.kom}" alt="${W.t}" width="250" height="288"><div class="cap">${W.cap}</div>`;
  if(W.img==='crop'){const [x,y]=MAPINFO.snezka;pic=`<div class="crop" role="img" aria-label="${W.cap}" style="background-image:url(${IMG.map});background-size:${MAPINFO.css.width}px ${MAPINFO.css.height}px;background-position:${125-x}px ${80-y}px"><i></i></div><div class="cap">${W.cap}</div>`}
  return kxBar(BOOKT[lang],'#/wiki/komensky')+`<article class="zim" lang="${lang}">
    <h1>${W.t}</h1>
    <div class="ibx"><div class="t">${W.t}</div>${pic}<table>${W.box.map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table></div>
    <p>${links(W.lead)}</p>
    ${W.sec.map(([h,ps,list])=>`<h2>${h}</h2>${ps.map(p=>`<p>${links(p)}</p>`).join('')}${list?`<ul>${list.map(([a,b])=>`<li><a href="#" data-x><i>${a}</i></a> – ${b}</li>`).join('')}</ul>`:''}`).join('')}
    <p class="mnote">${L.mnote}</p></article>`+mock();
}

function results(q){
  const r = lookup(q).filter(e=>e.c==='wiki'&&!e.t.endsWith('fulltext'));
  return kxBar(BOOKT[lang],'#/wiki/komensky',q)+`<div class="kres"><p class="hd">Results <b>1-${r.length}</b> of <b>${r.length}</b> for <b>"${html(q)}"</b></p>
    ${r.map(e=>`<div class="r"><a href="${e.h||'#'}" ${e.h?'':'data-x'}>${e.t}</a><cite>from ${BOOKT[lang]}</cite></div>`).join('')}</div>`+mock();
}

// The drive's own pages (Nouzové příručky, Hry v prohlížeči) run in an iframe, exactly as in the Kiwix viewer.
const FRAMES = {
  pomoc:{book:'Nouzové příručky', home:'#/pomoc', docs:()=>DOCS.prirucky},
  hry:{book:'Hry v prohlížeči', home:'#/hry', docs:()=>DOCS.hry}
};
function framePage(kind){ const F=FRAMES[kind]; return kxBar(F.book,F.home)+`<iframe class="kframe" id="kf" title="${F.book}"></iframe>`+mock(); }
function frameInit(kind, name, anchor){
  const f=$('#kf'), doc=FRAMES[kind].docs()[name]; if(!f||!doc) return;
  f.onload=()=>{
    let d; try{d=f.contentDocument}catch(e){return}
    if(!d) return;
    d.addEventListener('click',e=>{
      const a=e.target.closest('a'); if(!a||!a.hasAttribute('href')) return;
      e.preventDefault();
      const h=a.getAttribute('href'); let m;
      if(h.startsWith('#')){const t=d.getElementById(h.slice(1)); if(t) t.scrollIntoView(); return}
      if(kind==='pomoc'&&(m=h.match(/^([a-z0-9-]+)\.html(?:#(.+))?$/))&&DOCS.prirucky[m[1]]) return go('#/p/'+m[1]+(m[2]?'/'+m[2]:''));
      if(kind==='hry'&&h==='2048/index.html') return go('#/hry/2048');
      toast(L.demo);
    });
    if(anchor){const t=d.getElementById(anchor); if(t) t.scrollIntoView();}
    if(name==='2048') f.contentWindow.focus();
  };
  f.srcdoc = doc;
}

function zimMain(){
  return kxBar('Wikizdroje','#/knihovna')+`<div class="zim" lang="cs"><h1>Wikizdroje:Hlavní strana</h1><div class="cols"><div>
    <h2>Vítejte na Wikizdrojích</h2><p><b>Wikizdroje</b> jsou svobodná knihovna českých textů. Jsou tu díla, u kterých už vypršela autorská práva, i texty pod svobodnou licencí.</p>
    <h2>Česká klasika</h2><ul>${[['Babička','Božena Němcová'],['Máj','Karel Hynek Mácha'],['Kytice','Karel Jaromír Erben'],['Povídky malostranské','Jan Neruda'],['R.U.R.','Karel Čapek'],['Válka s Mloky','Karel Čapek']].map(([a,b])=>`<li><a href="#" data-x><b>${a}</b></a> – ${b}</li>`).join('')}</ul>
    </div><div><div class="box"><h2>Hledání</h2><p>Dílo najdete podle názvu v poli <b>Hledat 'Wikizdroje'</b> nahoře.</p></div></div></div>
    <p class="mnote">${L.mnote.replace(/Wikipedi[ea]|Wikipédie/,'Wikizdrojů')}</p></div>`+mock();
}

function mapPage(){
  return kxBar('Czech Republic','#/mapy/krkonose')+`<div class="kmap" id="mstage">
    <div class="minner" id="minner" style="width:${MAPINFO.css.width}px;height:${MAPINFO.css.height}px"><img src="${IMG.map}" width="${MAPINFO.css.width}" height="${MAPINFO.css.height}" alt="${L.mapAlt}" draggable="false"></div>
    <button class="mlq" data-x title="About this map">?</button>
    <div class="mlscale" id="scale"></div>
    <div class="mlattr"><span>MapLibre | OpenFreeMap © OpenMapTiles Data from OpenStreetMap</span><i>i</i></div></div>`+mock();
}

/* ============ MAP (pan + zoom over the captured real map) ============ */
const M = {x:0,y:0,z:1};
function mapInit(id){
  const st=$('#mstage'), inn=$('#minner'); if(!st) return;
  const W=MAPINFO.css.width, H=MAPINFO.css.height, maxZ=MAPINFO.dsf;
  const minZ=()=>Math.max(st.clientWidth/W, st.clientHeight/H);
  function apply(anim){
    M.z=Math.min(maxZ,Math.max(minZ(),M.z));
    M.x=Math.min(0,Math.max(st.clientWidth-W*M.z,M.x)); M.y=Math.min(0,Math.max(st.clientHeight-H*M.z,M.y));
    inn.classList.toggle('anim',!!anim);
    inn.style.transform=`translate(${M.x}px,${M.y}px) scale(${M.z})`;
    // MapLibre ScaleControl: longest round distance that fits 100 px
    const mpp=MAPINFO.metersPerCssPx/M.z, max=100*mpp, p=Math.pow(10,Math.floor(Math.log10(max))), d=max/p, n=p*(d>=10?10:d>=5?5:d>=3?3:d>=2?2:1);
    const s=$('#scale'); s.style.width=Math.round(n/mpp)+'px'; s.textContent=n>=1000?n/1000+' km':n+' m';
  }
  function center(px,py,z){M.z=z;M.x=st.clientWidth/2-px*z;M.y=st.clientHeight/2-py*z;apply(false)}
  if(SPOTS[id]&&id!=='krkonose'){const [x,y]=spotPx(id);center(x,y,1.25)}            // a town picked on the START page (#lat/lon/zoom on the drive)
  else if(st.clientWidth<700) center(1600,500,0.9); else center(1290,560,1);           // eastern Krkonoše around Pec pod Sněžkou
  const pts=new Map(); let last=null;
  st.onpointerdown=e=>{if(e.target.closest('button'))return;st.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);st.classList.add('drag');last=null};
  st.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p0=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){M.x+=e.clientX-p0[0];M.y+=e.clientY-p0[1];apply(false);return}
    const [a,b]=[...pts.values()], dist=Math.hypot(a[0]-b[0],a[1]-b[1]), r=st.getBoundingClientRect();
    if(last) zoomAt(dist/last,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,false); last=dist};
  st.onpointerup=st.onpointercancel=e=>{pts.delete(e.pointerId);last=null;if(!pts.size)st.classList.remove('drag')};
  function zoomAt(f,cx,cy,anim){const z0=M.z,z1=Math.min(maxZ,Math.max(minZ(),z0*f));M.x=cx-(cx-M.x)*z1/z0;M.y=cy-(cy-M.y)*z1/z0;M.z=z1;apply(anim)}
  st.onwheel=e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top,false)};
  st.ondblclick=e=>{const r=st.getBoundingClientRect();zoomAt(1.5,e.clientX-r.left,e.clientY-r.top,true)};
}

/* ============ ROUTER + EVENTS ============ */
function route(){
  L=T[lang]; document.documentElement.lang=lang; document.title=L.title;
  const [, page='', ...rest] = location.hash.split('/');
  const a = decodeURIComponent(rest[0]||''), b = decodeURIComponent(rest[1]||'');
  const pages = {
    s:()=>shelf(a), wiki:()=>wikiPage(a), hledat:()=>results(a), mapy:mapPage, knihovna:zimMain,
    pomoc:()=>framePage('pomoc'), p:()=>framePage('pomoc'), hry:()=>framePage('hry')};
  app.innerHTML = (pages[page]||home)();
  if(page==='mapy') mapInit(a);
  else if(page==='pomoc') frameInit('pomoc', a?'prvni-pomoc':'index', a);
  else if(page==='p') frameInit('pomoc', a||'index', b);
  else if(page==='hry') frameInit('hry', a==='2048'?'2048':'index');
  if(!route.keep) window.scrollTo(0,0);
  route.keep=false;
}
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function search(q){ q=q.trim(); if(!q) return;
  if(LIVE){location.href=REAL.search(q);return}
  go('#/hledat/'+encodeURIComponent(q)); }

window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const t=e.target;
  const lb=t.closest('[data-lang]'); if(lb){lang=lb.dataset.lang;store.set('lang',lang);store.set('userlang',lang);route.keep=true;route();return}
  const q=t.closest('[data-q]'); if(q){const i=$('.hero input');i.value=q.dataset.q;i.focus();suggest(i);return}
  const dv=t.closest('[data-dev]'); if(dv){setDev(dv.dataset.dev==='mob'&&dev==='mob'?'pc':dv.dataset.dev);return}
  const pk=t.closest('[data-peak]'); if(pk){peak=+pk.dataset.peak;$('#tc-peak').outerHTML=peakCard();$(`[data-peak="${peak}"]`).focus();return}
  const sp=t.closest('[data-spot]'); if(sp){setSpot(sp.dataset.spot);return}
  if(t.closest('[data-x]')){e.preventDefault();toast(L.demo);return}
  const s=t.closest('.sug a'); if(s){$('.sug',s.closest('form')).hidden=true}
  if(!t.closest('.search')) document.querySelectorAll('.sug').forEach(x=>x.hidden=true);
});
function setDev(d){
  dev=d; const w=$('.where'), m=$('#mobil'); if(!w||!m) return;
  w.outerHTML=whereRow(); m.hidden=dev!=='mob'; $(`[data-dev="${d}"]`).focus();
  if(dev==='mob'){const r=m.getBoundingClientRect(); if(r.bottom>innerHeight) window.scrollTo({top:scrollY+r.top-84,behavior:'smooth'})}
}
function setSpot(id){   // pan the preview (real map capture) to the town, keep the card in place
  spot=id; const c=$('#tc-spot'); if(!c) return;
  c.querySelectorAll('[data-spot]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.spot===id));
  $('.ml',c).setAttribute('style',mlPos(id)); $('.mprev',c).setAttribute('aria-label',`${SPOTS[id][0]} (${L.mapCap})`);
  const a=$('.more',c), h=sl(id).match(/href="([^"]*)"/); if(a&&h) a.setAttribute('href',h[1].replace(/&amp;/g,'&'));
}
function suggest(inp){
  const f=inp.closest('form.search'); if(!f) return;
  const box=$('.sug',f), q=inp.value.trim();
  if(!q){box.hidden=true;return}
  box.innerHTML = lookup(q).map((e,i)=>`<a href="${e.h||'#'}" ${e.h?'':'data-x'} class="${i?'':'on'}">${ico(e.c)}${html(e.t)}<em>${L.cat[e.c]}</em></a>`).join('');
  box.hidden=false;
}
document.addEventListener('input',e=>{if(e.target.matches('.search input'))suggest(e.target)});
document.addEventListener('focusin',e=>{if(e.target.matches('.search input')&&e.target.value)suggest(e.target)});
document.addEventListener('keydown',e=>{
  if(!e.target.matches('.search input'))return;
  const box=$('.sug',e.target.closest('form')); if(!box||box.hidden)return;
  const it=[...box.querySelectorAll('a')], i=it.findIndex(x=>x.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!it.length)return;it[i]&&it[i].classList.remove('on');it[(i+(e.key==='ArrowDown'?1:it.length-1))%it.length].classList.add('on')}
  if(e.key==='Escape')box.hidden=true;
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.matches('form.kxs')){e.preventDefault();const v=$('input',f).value.trim();if(v)go('#/hledat/'+encodeURIComponent(v));return}
  if(!f.matches('form.search'))return;
  e.preventDefault();
  const box=$('.sug',f), on=box&&!box.hidden&&$('a.on',box), inp=$('input',f);
  if(on&&!LIVE){box.hidden=true; if(on.hasAttribute('data-x')) toast(L.demo); else go(on.getAttribute('href'))} else search(inp.value);
});
document.documentElement.style.setProperty('--mapimg', `url(${IMG.map})`);
route();
// On the drive: ask kiwix-serve which books this stick carries, so shelf links never point at a missing book.
if(LIVE) fetch('/catalog/v2/entries?count=-1').then(r=>r.ok?r.text():Promise.reject(r.status)).then(x=>{
  const before=Object.keys(BOOKS).map(alias).join(), list=[...new Set([...x.matchAll(/href="\/content\/([^"\/?#]+)"/g)].map(m=>m[1].replace(/_\d{4}-\d{2}$/,'')))];
  if(!list.length) return;
  HAVE=list;
  const a=document.activeElement;
  if(Object.keys(BOOKS).map(alias).join()!==before && !(a&&a.matches&&a.matches('input'))){route.keep=true;route()}
}).catch(()=>{});
</script>
