# XcodeGen spec of the Offlinka iOS app. Generate the project with `xcodegen` in this folder
# (never hand-edit Offlinka.xcodeproj; it is git-ignored). Steps: ios/README.md.
name: Offlinka

options:
  bundleIdPrefix: cz.offlinka
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # agvtool (fastlane increment_build_number) needs this.
    VERSIONING_SYSTEM: apple-generic
    # Swift 5 language mode (needs the Swift 5.10+ compiler: Xcode 15.3 or newer).
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # Team id comes from the environment (fastlane / local shell), never from this repo.
    DEVELOPMENT_TEAM: "${OFFLINKA_TEAM_ID}"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Strings are typed keys (Str.swift); never let the compiler rewrite design's catalog.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Offlinka:
    type: application
    platform: iOS
    sources:
      - path: Offlinka
        excludes:
          - "Resources"
          - "Resources/**"
          # The C header and module map ship inside OfflinkaCore.xcframework.
          - "Generated/*.h"
          - "Generated/*.modulemap"
      - path: Offlinka/Resources
        buildPhase: resources
      # Design system (source of truth in design/, shared with Android).
      - path: ../design/out/ios/Brand.swift
      - path: ../design/out/ios/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/fonts
        buildPhase: resources
        includes:
          - "*.ttf"
      - path: ../design/out/ios/icons/Icons.xcassets
        buildPhase: resources
      # Reader stylesheet + hook, served at /_offlinka/reader.css and /_offlinka/inject.js.
      - path: ../design/reader/offlinka-reader.css
        buildPhase: resources
        optional: true
      - path: ../design/reader/inject.js
        buildPhase: resources
        optional: true
    dependencies:
      # Static library + C header + module map `offlinka_coreFFI`, built by scripts/build-ios-core.sh.
      - framework: Frameworks/OfflinkaCore.xcframework
        embed: false
    info:
      path: Support/Offlinka-Info.plist
      properties:
        CFBundleDisplayName: Offlinka
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs, sk, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.reference
        # Not a document browser: the drive is opened in place through the folder picker.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Archivo (design/fonts); PostScript names are in design/out/ios/Brand.swift.
        UIAppFonts:
          - archivo_regular.ttf
          - archivo_semibold.ttf
          - archivo_bold.ttf
          - archivo_expanded_extrabold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.offlinka.app
        PRODUCT_NAME: Offlinka
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  OfflinkaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfflinkaTests
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      # Optional real ZIMs for the core integration test (git-ignored; see README).
      - path: OfflinkaTests/Fixtures
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: Offlinka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.offlinka.app.tests
        GENERATE_INFOPLIST_FILE: YES

  OfflinkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OfflinkaUITests
    dependencies:
      - target: Offlinka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.offlinka.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Offlinka

schemes:
  Offlinka:
    build:
      targets:
        Offlinka: all
        OfflinkaTests: [test]
        OfflinkaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Offlinka
      targets:
        - name: OfflinkaTests
        - name: OfflinkaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
