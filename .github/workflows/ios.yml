# iOS: core XCFramework → one build of the app and its tests → tests on the simulator (+ unsigned Release
# archive). By hand (workflow_dispatch), after the tests are green: App Store screenshots, App Review demo video.
# Built once: the test, screenshot and video jobs run the same products (`.xctestrun`) without building.
# No secrets: signing and TestFlight come later (ios/fastlane). Third-party actions are pinned to commit SHAs.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "core/**"
      - "design/**"
      - "android/app/src/main/assets/offlinka_cs_prirucky.zim"
      - "scripts/build-ios-core.sh"
      - "scripts/gen-bindings.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "core/**"
      - "design/**"
      - "android/app/src/main/assets/offlinka_cs_prirucky.zim"
      - "scripts/build-ios-core.sh"
      - "scripts/gen-bindings.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        description: "Run only these tests (comma-separated -only-testing targets, e.g. OfflinkaUITests/FixtureDriveUITests); empty = all"
        type: string
        default: ""
      store_shots:
        description: "App Store screenshots (cs, sk, en on iPhone 6.9\", 6.3\" and iPad 13\"), after the tests"
        type: boolean
        default: false
      shot_devices:
        description: "Screenshot sets to capture: all, or some of iphone-69,iphone-63,ipad-13"
        type: string
        default: all
      shot_langs:
        description: "Screenshot languages (comma-separated)"
        type: string
        default: cs,sk,en
      demo_video:
        description: "App Review demo video (simulator recording of the demo walk), after the tests"
        type: boolean
        default: false
      demo_language:
        description: "UI language of the demo video"
        type: choice
        options: [cs, sk, en]
        default: cs

permissions:
  contents: read

# A newer push replaces the run in progress (macOS runners are scarce); manual runs have their own group.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the App Store takes today (Xcode 26 / iOS 26 SDK); runner image macos-26.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: "2.48.0"
  XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
  PROJECT: ios/Offlinka.xcodeproj
  SCHEME: Offlinka
  # Real drive content for the UI tests, screenshots and the demo video (public release asset, 1.5 GB):
  # OFFLINKA/Telefon/ Czech Wikipedia mini + .offidx and the games, OFFLINKA/Knihovna/ the Slovak map.
  SAMPLE_KEY: offlinka-review-sample-2026-11
  SAMPLE_URL: https://github.com/Ollsoft-ai/offlinka-app/releases/download/review-sample-2026-11/offlinka-review-sample.zip
  SAMPLE_SHA256: ead728a157a3b843914e4882984aff6ae5001a906b393955aa4137feb28eb6cc
  # The store screenshots' drive (public release asset): the real drive's books trimmed to the pages the
  # frames show (Czech and Slovak Wikipedia with pictures, the whole map of Czechia), plus sizes.json with
  # the real file sizes. Reviewers and the demo video keep the review sample above.
  SHOTS_KEY: offlinka-store-shots-2026-11
  SHOTS_URL: https://github.com/Ollsoft-ai/offlinka-app/releases/download/store-shots-2026-11/offlinka-store-shots.zip
  SHOTS_SHA256: 3e616406d09de6da3f8b96539cdc1efab7f28f502bcd22a64dc39b48628dff34

jobs:
  core:
    name: Core XCFramework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The whole output, keyed by the core sources: an iOS-only change does not rebuild Rust.
      - name: Restore built XCFramework
        id: xcf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Frameworks/OfflinkaCore.xcframework
            ios/Offlinka/Generated
          key: ios-xcf-xcode26.6-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/uniffi.toml', 'core/src/**', 'core/uniffi-bindgen/**', 'scripts/build-ios-core.sh', 'scripts/gen-bindings.sh') }}

      - name: Restore cargo
        if: steps.xcf.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: ios-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ios-cargo-

      - name: Build core XCFramework
        if: steps.xcf.outputs.cache-hit != 'true'
        run: scripts/build-ios-core.sh

      - name: Committed bindings match the core
        run: |
          if ! git diff --quiet -- ios/Offlinka/Generated; then
            echo "::warning::ios/Offlinka/Generated differs from what this core generates: run scripts/gen-bindings.sh and commit"
            git diff --stat -- ios/Offlinka/Generated
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core
          path: |
            ios/Frameworks/OfflinkaCore.xcframework
            ios/Offlinka/Generated
          retention-days: 3
          if-no-files-found: error

  # Downloads the review sample once (on a cheap Linux runner) into a cache the macOS jobs restore.
  sample:
    name: Review sample drive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Look up cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: review-sample
          key: ${{ env.SAMPLE_KEY }}
          enableCrossOsArchive: true
          lookup-only: true

      - name: Download and check
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sample.zip" "$SAMPLE_URL"
          echo "$SAMPLE_SHA256  $RUNNER_TEMP/sample.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sample.zip" -d review-sample
          rm "$RUNNER_TEMP/sample.zip"
          find review-sample -type f -exec ls -l {} +

      - name: Save cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: review-sample
          key: ${{ env.SAMPLE_KEY }}
          enableCrossOsArchive: true

  # The one Debug build of the app, the unit tests and the UI tests (arm64 simulator), shared as an artifact.
  build:
    name: Build for testing
    needs: core
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Module caches and intermediates of the last build with this Xcode (the project has no SPM packages).
      - name: Restore DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dd
            !build/dd/Build/Products
            !build/dd/Logs
          key: ios-dd-xcode26.6-${{ hashFiles('ios/**', 'design/**') }}
          restore-keys: ios-dd-xcode26.6-

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: ios

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # Core tests: the guides ZIM in the test bundle (offlinka_mul_hry.zim: no test needs it).
      - name: Generate project
        run: |
          xcodebuild -version
          cp android/app/src/main/assets/offlinka_cs_prirucky.zim ios/OfflinkaTests/Fixtures/
          ios/tools/sync-design.sh
          (cd ios && xcodegen generate)

      - name: Build (app + unit tests + UI tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify --renderer github-actions

      # tar keeps the executable bits that a plain artifact upload drops.
      - name: Pack products
        run: |
          ls build/dd/Build/Products
          tar -C build/dd/Build -cf build/products.tar Products

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-products
          path: build/products.tar
          retention-days: 2
          if-no-files-found: error
          compression-level: 1

  test:
    name: Test (iPhone 17)
    needs: [build, sample]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A simulator's first boot takes minutes on these runners: start it now, it boots while the rest downloads.
      - name: Boot simulator
        id: sim
        run: |
          udid=$(ios/tools/pick-simulator.py "iPhone 17")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          (xcrun simctl boot "$udid" >/dev/null 2>&1 &)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-products
          path: build

      - name: Restore review sample drive
        id: sample
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"   # a stalled restore falls back to the release asset sooner
        with:
          path: review-sample
          key: ${{ env.SAMPLE_KEY }}
          enableCrossOsArchive: true

      - name: Download review sample drive (cache miss)
        if: steps.sample.outputs.cache-hit != 'true'
        run: |
          rm -rf review-sample
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sample.zip" "$SAMPLE_URL"
          echo "$SAMPLE_SHA256  $RUNNER_TEMP/sample.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/sample.zip" -d review-sample
          rm "$RUNNER_TEMP/sample.zip"

      - name: Test (unit, core, UI smoke)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY_TESTING: ${{ inputs.only_testing }}
          TEST_RUNNER_OFFLINKA_FIXTURE_DRIVE: ${{ github.workspace }}/review-sample/OFFLINKA
        run: |
          set -o pipefail
          tar -C build -xf build/products.tar
          xctestrun=$(ls build/Products/*.xctestrun | head -1)
          only=()
          IFS=',' read -r -a targets <<< "${ONLY_TESTING:-}"
          for t in "${targets[@]}"; do t="${t// /}"; [ -n "$t" ] && only+=("-only-testing:$t"); done
          ios/tools/sim-prepare.sh "$UDID"
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO -resultBundlePath build/Offlinka.xcresult ${only[@]+"${only[@]}"} | xcbeautify --renderer github-actions

      - name: Export screenshots and app log
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          [ -d build/Offlinka.xcresult ] && ios/tools/export-shots.py build/Offlinka.xcresult build/screenshots || true
          mkdir -p build/screenshots
          xcrun simctl spawn "$UDID" log show --last 60m --style compact \
            --predicate 'subsystem == "cz.offlinka.app"' > build/screenshots/app-log.txt 2>&1 || true
          tail -n 40 build/screenshots/app-log.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-test-results
          path: |
            build/Offlinka.xcresult
            build/screenshots
          retention-days: 14
          if-no-files-found: ignore

  screenshots:
    name: App Store screenshots
    needs: [build, sample, test]
    if: github.event_name == 'workflow_dispatch' && inputs.store_shots
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Store sizes: 6.9" 1320x2868, 6.3" 1206x2622, iPad 13" 2064x2752.
      # The 6.9" goes last: right after three simulators boot, the first one was twice not yet a destination.
      SHOT_DEVICES: "iPhone 17 Pro:iphone-63|iPad Pro 13-inch (M5):ipad-13|iPhone 17 Pro Max:iphone-69"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-products
          path: build

      - name: Restore store-shots drive
        id: shots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
        with:
          path: store-shots
          key: ${{ env.SHOTS_KEY }}

      - name: Download store-shots drive (cache miss)
        if: steps.shots.outputs.cache-hit != 'true'
        run: |
          rm -rf store-shots
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shots.zip" "$SHOTS_URL"
          echo "$SHOTS_SHA256  $RUNNER_TEMP/shots.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/shots.zip" -d store-shots
          rm "$RUNNER_TEMP/shots.zip"
          ls store-shots

      # Booted after the downloads: three booting simulators slow the artifact download to a crawl.
      - name: Boot simulators
        env:
          ONLY_SETS: ${{ inputs.shot_devices }}
        run: |
          IFS='|'; for pair in $SHOT_DEVICES; do
            folder="${pair##*:}"
            if [ -n "${ONLY_SETS:-}" ] && [ "$ONLY_SETS" != all ] && [[ ",${ONLY_SETS// /}," != *",$folder,"* ]]; then continue; fi
            udid=$(ios/tools/pick-simulator.py "${pair%%:*}")
            (xcrun simctl boot "$udid" >/dev/null 2>&1 &)
          done

      - name: Capture
        env:
          ONLY_SETS: ${{ inputs.shot_devices }}
          TEST_RUNNER_OFFLINKA_STORE_SHOTS: "1"
          TEST_RUNNER_OFFLINKA_STORE_LANGS: ${{ inputs.shot_langs || 'cs,sk,en' }}
          TEST_RUNNER_OFFLINKA_FIXTURE_DRIVE: ${{ github.workspace }}/store-shots/OFFLINKA
          TEST_RUNNER_OFFLINKA_FIXTURE_SIZES: ${{ github.workspace }}/store-shots/sizes.json
          # Prague's old town at street level (as in store/screenshots/frames.json)
          TEST_RUNNER_OFFLINKA_MAP_VIEW: "50.0868,14.4163,15"
        run: |
          set -o pipefail
          tar -C build -xf build/products.tar
          xctestrun=$(ls build/Products/*.xctestrun | head -1)
          status=0
          IFS='|' read -r -a pairs <<< "$SHOT_DEVICES"
          # Every simulator fully booted before the first test: a test next to a booting simulator failed to launch.
          for pair in "${pairs[@]}"; do
            folder="${pair##*:}"
            if [ -n "${ONLY_SETS:-}" ] && [ "$ONLY_SETS" != all ] && [[ ",${ONLY_SETS// /}," != *",$folder,"* ]]; then continue; fi
            xcrun simctl bootstatus "$(ios/tools/pick-simulator.py "${pair%%:*}")" -b >/dev/null || true
          done
          for pair in "${pairs[@]}"; do
            device="${pair%%:*}"; folder="${pair##*:}"
            if [ -n "${ONLY_SETS:-}" ] && [ "$ONLY_SETS" != all ] && [[ ",${ONLY_SETS// /}," != *",$folder,"* ]]; then continue; fi
            udid=$(ios/tools/pick-simulator.py "$device")
            ios/tools/sim-prepare.sh "$udid"
            # A simulator that has just finished booting is sometimes not yet a destination: try again.
            ok=0
            for attempt in 1 2 3 4 5; do
              rm -rf "build/shots-$folder.xcresult"
              if xcodebuild test-without-building -xctestrun "$xctestrun" -destination "platform=iOS Simulator,id=$udid" \
                  -parallel-testing-enabled NO -only-testing:OfflinkaUITests/StoreScreenshotTests \
                  -resultBundlePath "build/shots-$folder.xcresult" | xcbeautify --renderer github-actions; then ok=1; break; fi
              [ -d "build/shots-$folder.xcresult" ] && break   # the tests ran and failed: no retry
              echo "::warning::$device: no destination yet (attempt $attempt)"; sleep 60
            done
            [ $ok = 1 ] || status=1
            ios/tools/export-shots.py "build/shots-$folder.xcresult" "build/store-shots/$folder" --prefix cz.offlinka.ui_ || status=1
            xcrun simctl spawn "$udid" log show --last 90m --style compact \
              --predicate 'subsystem == "cz.offlinka.app"' > "build/store-shots/$folder/app-log.txt" 2>&1 || true
            xcrun simctl shutdown "$udid" || true
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-store-shots
          path: build/store-shots
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-store-shots-results
          path: build/shots-*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  demo-video:
    name: App Review demo video
    needs: [build, sample, test]
    if: github.event_name == 'workflow_dispatch' && inputs.demo_video
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-products
          path: build

      - name: Restore review sample drive
        id: sample
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"   # a stalled restore falls back to the release asset sooner
        with:
          path: review-sample
          key: ${{ env.SAMPLE_KEY }}
          enableCrossOsArchive: true

      - name: Download review sample drive (cache miss)
        if: steps.sample.outputs.cache-hit != 'true'
        run: |
          rm -rf review-sample
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sample.zip" "$SAMPLE_URL"
          echo "$SAMPLE_SHA256  $RUNNER_TEMP/sample.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/sample.zip" -d review-sample
          rm "$RUNNER_TEMP/sample.zip"

      - name: Boot simulator
        id: sim
        run: |
          udid=$(ios/tools/pick-simulator.py "iPhone 17 Pro")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          (xcrun simctl boot "$udid" >/dev/null 2>&1 &)

      # The whole simulator screen from before the app starts; the walk pauses ~1.5 s between steps.
      - name: Record the demo walk
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_OFFLINKA_DEMO_WALK: "1"
          TEST_RUNNER_OFFLINKA_DEMO_LANG: ${{ inputs.demo_language }}
          TEST_RUNNER_OFFLINKA_FIXTURE_DRIVE: ${{ github.workspace }}/review-sample/OFFLINKA
        run: |
          set -o pipefail
          tar -C build -xf build/products.tar
          xctestrun=$(ls build/Products/*.xctestrun | head -1)
          ios/tools/sim-prepare.sh "$UDID"
          mkdir -p build/video
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/video/offlinka-demo-walk.mp4 &
          recorder=$!
          sleep 3
          status=0
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO -only-testing:OfflinkaUITests/FixtureDriveUITests/testDemoWalkthrough \
            -resultBundlePath build/demo.xcresult | xcbeautify --renderer github-actions || status=1
          sleep 2
          kill -INT "$recorder"
          wait "$recorder" || true
          ls -l build/video
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-demo-video
          path: build/video
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-demo-video-results
          path: build/demo.xcresult
          retention-days: 7
          if-no-files-found: ignore

  archive:
    name: Unsigned Release archive
    needs: core
    if: github.event_name != 'workflow_dispatch' || inputs.only_testing == ''
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: ios

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          ios/tools/sync-design.sh
          (cd ios && xcodegen generate)

      - name: Archive (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Offlinka.xcarchive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify --renderer github-actions

      - name: Check the archive
        run: |
          APP=build/Offlinka.xcarchive/Products/Applications/Offlinka.app
          test -x "$APP/Offlinka"
          test -f "$APP/offlinka_cs_prirucky.zim"
          test -f "$APP/PrivacyInfo.xcprivacy"
          lipo -info "$APP/Offlinka"
          # Test-only launch arguments must not ship.
          if strings "$APP/Offlinka" | grep -E -- '-(demo|fixture)-(drive|sizes|map-view|language|theme)'; then echo "::error::debug launch arguments in the Release binary"; exit 1; fi
          # Nothing logs pages or searches in Release (DebugLog is debug-only), and no build-machine paths.
          if strings "$APP/Offlinka" | grep -E 'scheme #|reader open|user data not saved'; then echo "::error::debug log text in the Release binary"; exit 1; fi
          if strings "$APP/Offlinka" | grep -E '/Users/[^/]+/\.(cargo|rustup)'; then echo "::error::build-machine paths in the Release binary"; exit 1; fi
          {
            echo "### Unsigned Release archive"
            echo "- version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
            echo "- SDK: $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist"), Xcode $(/usr/libexec/PlistBuddy -c 'Print :DTXcode' "$APP/Info.plist")"
            echo "- app: $(du -sh "$APP" | cut -f1), binary: $(du -h "$APP/Offlinka" | cut -f1)"
            # Required-reason APIs linked (compare with ios/Offlinka/Resources/PrivacyInfo.xcprivacy).
            echo "- required-reason symbols: $(nm -u "$APP/Offlinka" | grep -E '^_(mach_absolute_time|stat|fstat|lstat|fstatat|statfs|fstatfs|getattrlist|getattrlistbulk|fgetattrlist|systemUptime)$' | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
