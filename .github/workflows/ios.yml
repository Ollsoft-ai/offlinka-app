# iOS: core XCFramework, build + unit/UI tests on the simulator, App Store screenshots, unsigned Release archive.
# No secrets: signing and TestFlight come later (ios/fastlane). Third-party actions are pinned to commit SHAs.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "core/**"
      - "design/**"
      - "android/app/src/main/assets/offlinka_cs_prirucky.zim"
      - "scripts/build-ios-core.sh"
      - "scripts/gen-bindings.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "core/**"
      - "design/**"
      - "android/app/src/main/assets/offlinka_cs_prirucky.zim"
      - "scripts/build-ios-core.sh"
      - "scripts/gen-bindings.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      store_shots:
        description: "App Store screenshots (cs, sk, en on iPhone 6.9\", 6.3\" and iPad 13\")"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the App Store takes today (Xcode 26 / iOS 26 SDK); runner image macos-26.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: "2.48.0"
  XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
  PROJECT: ios/Offlinka.xcodeproj
  SCHEME: Offlinka

jobs:
  core:
    name: Core XCFramework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The whole output, keyed by the core sources: an iOS-only change does not rebuild Rust.
      - name: Restore built XCFramework
        id: xcf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Frameworks/OfflinkaCore.xcframework
            ios/Offlinka/Generated
          key: ios-xcf-xcode26.6-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/uniffi.toml', 'core/src/**', 'core/uniffi-bindgen/**', 'scripts/build-ios-core.sh', 'scripts/gen-bindings.sh') }}

      - name: Restore cargo
        if: steps.xcf.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: ios-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ios-cargo-

      - name: Build core XCFramework
        if: steps.xcf.outputs.cache-hit != 'true'
        run: scripts/build-ios-core.sh

      - name: Committed bindings match the core
        run: |
          if ! git diff --quiet -- ios/Offlinka/Generated; then
            echo "::warning::ios/Offlinka/Generated differs from what this core generates: run scripts/gen-bindings.sh and commit"
            git diff --stat -- ios/Offlinka/Generated
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core
          path: |
            ios/Frameworks/OfflinkaCore.xcframework
            ios/Offlinka/Generated
          retention-days: 3
          if-no-files-found: error

  test:
    name: Build and test (iPhone 17)
    needs: core
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A simulator's first boot takes minutes on these runners: start it now, it boots during the build.
      - name: Boot simulator
        id: sim
        run: |
          udid=$(ios/tools/pick-simulator.py "iPhone 17")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          (xcrun simctl boot "$udid" >/dev/null 2>&1 &)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: ios

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          xcodebuild -version
          ios/tools/sync-design.sh
          (cd ios && xcodegen generate)

      # Real-core tests: the guides ZIM in the test bundle, and as the drive of the UI smoke test.
      # (offlinka_mul_hry.zim is not in the repo; no test needs it.)
      - name: Fixtures
        run: |
          cp android/app/src/main/assets/offlinka_cs_prirucky.zim ios/OfflinkaTests/Fixtures/
          mkdir -p "$RUNNER_TEMP/fixture-drive/OFFLINKA/Knihovna"
          cp android/app/src/main/assets/offlinka_cs_prirucky.zim "$RUNNER_TEMP/fixture-drive/OFFLINKA/Knihovna/"

      - name: Build (app + tests)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd | xcbeautify --renderer github-actions

      - name: Test (unit, core, UI smoke)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_OFFLINKA_FIXTURE_DRIVE: ${{ runner.temp }}/fixture-drive/OFFLINKA
        run: |
          set -o pipefail
          ios/tools/sim-prepare.sh "$UDID"
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -parallel-testing-enabled NO -resultBundlePath build/Offlinka.xcresult | xcbeautify --renderer github-actions

      - name: Export screenshots and app log
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          [ -d build/Offlinka.xcresult ] && ios/tools/export-shots.py build/Offlinka.xcresult build/screenshots || true
          mkdir -p build/screenshots
          xcrun simctl spawn "$UDID" log show --last 60m --style compact \
            --predicate 'subsystem == "cz.offlinka.app"' > build/screenshots/app-log.txt 2>&1 || true
          tail -n 80 build/screenshots/app-log.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-test-results
          path: |
            build/Offlinka.xcresult
            build/screenshots
          retention-days: 14
          if-no-files-found: ignore

  screenshots:
    name: App Store screenshots
    needs: core
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.store_shots)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Store sizes: 6.9" 1320x2868, 6.3" 1206x2622, iPad 13" 2064x2752.
      SHOT_DEVICES: "iPhone 17 Pro Max:iphone-69|iPhone 17 Pro:iphone-63|iPad Pro 13-inch (M5):ipad-13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Boot simulators
        run: |
          IFS='|'; for pair in $SHOT_DEVICES; do
            udid=$(ios/tools/pick-simulator.py "${pair%%:*}")
            (xcrun simctl boot "$udid" >/dev/null 2>&1 &)
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: ios

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          ios/tools/sync-design.sh
          (cd ios && xcodegen generate)

      - name: Build (app + UI tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd | xcbeautify --renderer github-actions

      - name: Capture
        env:
          TEST_RUNNER_OFFLINKA_STORE_SHOTS: "1"
          TEST_RUNNER_OFFLINKA_STORE_LANGS: cs,sk,en
        run: |
          set -o pipefail
          status=0
          IFS='|' read -r -a pairs <<< "$SHOT_DEVICES"
          for pair in "${pairs[@]}"; do
            device="${pair%%:*}"; folder="${pair##*:}"
            udid=$(ios/tools/pick-simulator.py "$device")
            ios/tools/sim-prepare.sh "$udid"
            xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=$udid" -derivedDataPath build/dd -parallel-testing-enabled NO \
              -only-testing:OfflinkaUITests/StoreScreenshotTests \
              -resultBundlePath "build/shots-$folder.xcresult" | xcbeautify --renderer github-actions || status=1
            ios/tools/export-shots.py "build/shots-$folder.xcresult" "build/store-shots/$folder" --prefix cz.offlinka.ui_ || status=1
            xcrun simctl shutdown "$udid" || true
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-store-shots
          path: build/store-shots
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-store-shots-results
          path: build/shots-*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  archive:
    name: Unsigned Release archive
    needs: core
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: ios

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          ios/tools/sync-design.sh
          (cd ios && xcodegen generate)

      - name: Archive (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Offlinka.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify --renderer github-actions

      - name: Check the archive
        run: |
          APP=build/Offlinka.xcarchive/Products/Applications/Offlinka.app
          test -x "$APP/Offlinka"
          test -f "$APP/offlinka_cs_prirucky.zim"
          test -f "$APP/PrivacyInfo.xcprivacy"
          lipo -info "$APP/Offlinka"
          # Test-only launch arguments must not ship.
          if strings "$APP/Offlinka" | grep -E -- '-(demo|fixture)-drive'; then echo "::error::debug launch arguments in the Release binary"; exit 1; fi
          {
            echo "### Unsigned Release archive"
            echo "- version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
            echo "- SDK: $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist"), Xcode $(/usr/libexec/PlistBuddy -c 'Print :DTXcode' "$APP/Info.plist")"
            echo "- app: $(du -sh "$APP" | cut -f1), binary: $(du -h "$APP/Offlinka" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
