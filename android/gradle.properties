# Shared box: small heap, few workers, no daemons left behind (always run ./gradlew --no-daemon).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=3
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=false
# Kotlin compiles inside the Gradle process: no Kotlin daemon survives the build.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
